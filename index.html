<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בוחן תרגול — מסכת אבות בראייה היסטורית ועכשווית</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#0f766e; --accentSoft:#e2f2ef;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#1d4f91; --clsBg:#e4edf9;
  --sumTx:#6b3fa0; --sumBg:#f0e9f8;
  --hardTx:#9a3412; --hardBg:#fdebdf;
  --chipBg:#efeee9; --onAccent:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
    --border:#37372f; --borderS:#4a4a46; --accent:#5fd3c0; --accentSoft:#143d38;
    --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
    --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
    --warnTx:#fac775; --warnBg:#4a2b06;
    --clsTx:#9cc0f0; --clsBg:#1c3350;
    --sumTx:#c9b3ee; --sumBg:#2e2340;
    --hardTx:#f4a97f; --hardBg:#3f2317;
    --chipBg:#2f2f2a; --onAccent:#0b1f1c;
  }
}
html.dark{
  --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
  --border:#37372f; --borderS:#4a4a46; --accent:#5fd3c0; --accentSoft:#143d38;
  --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
  --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
  --warnTx:#fac775; --warnBg:#4a2b06;
  --clsTx:#9cc0f0; --clsBg:#1c3350;
  --sumTx:#c9b3ee; --sumBg:#2e2340;
  --hardTx:#f4a97f; --hardBg:#3f2317;
  --chipBg:#2f2f2a; --onAccent:#0b1f1c;
}
html.light{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#0f766e; --accentSoft:#e2f2ef;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#1d4f91; --clsBg:#e4edf9;
  --sumTx:#6b3fa0; --sumBg:#f0e9f8;
  --hardTx:#9a3412; --hardBg:#fdebdf;
  --chipBg:#efeee9; --onAccent:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif;line-height:1.65;
  overflow-wrap:break-word;-webkit-text-size-adjust:100%;}
.wrap{max-width:820px;margin:0 auto;padding:22px 20px 60px;}
header h1{font-size:23px;margin:0 0 4px;font-weight:650;}
header .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;}
.aids{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.aid{display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:var(--chipBg);border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;color:var(--text);font-size:13.5px;transition:.15s;flex:1 1 260px;}
.aid:hover{border-color:var(--accent);}
.aid b{font-weight:650;}
.aid i{font-style:normal;font-size:16px;line-height:1;flex:none;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.scopehint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px;padding-right:2px;}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;}
.chip{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent);color:var(--onAccent);border-color:var(--accent);}
.chip small{opacity:.75;font-size:11px;}
.lbl{font-size:12px;color:var(--muted);margin-left:4px;align-self:center;min-width:44px;}
.spacer{flex:1;}
.iconbtn{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
.iconbtn:hover{border-color:var(--accent);}
.note{background:var(--accentSoft);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;font-size:13px;margin-bottom:14px;}
.note b{color:var(--accent);}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin-bottom:12px;color:var(--muted);}
.stats b{color:var(--text);}
.bar{height:7px;background:var(--chipBg);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);}
.qtext{font-size:17.5px;font-weight:600;margin-bottom:15px;line-height:1.6;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--borderS);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.12s;
  background:var(--surface);width:100%;text-align:right;font:inherit;color:var(--text);}
.opt:hover{border-color:var(--accent);background:var(--accentSoft);}
.opt .ltr{font-weight:700;color:var(--accent);min-width:19px;}
.opt.correct{background:var(--okBg);border-color:var(--okBd);}
.opt.correct .ltr{color:var(--okTx);}
.opt.wrong{background:var(--errBg);border-color:var(--errBd);}
.opt.wrong .ltr{color:var(--errTx);}
.opt.locked{cursor:default;}
.opt.locked:hover{background:var(--surface);border-color:var(--borderS);}
.opt.correct.locked:hover{background:var(--okBg);border-color:var(--okBd);}
.opt.wrong.locked:hover{background:var(--errBg);border-color:var(--errBd);}
/* במצב מבחן אין משוב עד ההגשה — הבחירה מסומנת בצבע נייטרלי. ירוק אומר "נכון". */
.opt.picked{background:var(--accentSoft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.opt.picked .ltr{color:var(--accent);}
.opt.picked:hover{background:var(--accentSoft);border-color:var(--accent);}
.opt.picked .ltr::after{content:" ✓";font-size:12px;}
.expl{margin-top:8px;padding:13px 15px;border-radius:10px;background:var(--accentSoft);
  border:1px solid var(--border);font-size:14px;}
.expl .tag{font-weight:700;color:var(--accent);}
.nav{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit;}
.btn:hover{border-color:var(--accent);}
.btn-pri{background:var(--accent);color:var(--onAccent);border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:190px;overflow-y:auto;}
.pbtn{width:33px;height:33px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;}
.pbtn.cur{outline:2px solid var(--accent);outline-offset:1px;}
.pbtn.ok{background:var(--okBg);border-color:var(--okBd);color:var(--okTx);}
.pbtn.bad{background:var(--errBg);border-color:var(--errBd);color:var(--errTx);}
.pbtn.ans{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);}
.ptitle{font-size:12.5px;color:var(--muted);margin-bottom:7px;}
.result{text-align:center;}
.result .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1.1;}
.result .grade{font-size:17px;margin:8px 0 16px;}
.clock{font-variant-numeric:tabular-nums;font-weight:650;}
.rev{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface2);font-size:14px;text-align:right;}
.rev .rq{font-weight:600;margin-bottom:6px;}
.rev .ra{color:var(--errTx);}
.rev .rc{color:var(--okTx);}
/* המילה שמכריעה בין התשובות, בהסברים של השאלות הקשות */
mark.key{background:var(--warnBg);color:inherit;padding:0 3px;border-radius:4px;font-weight:650;}
.ctitle{font-size:16px;font-weight:650;margin:0 0 6px;}
.brk{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-bottom:7px;}
.brk .bl{flex:0 0 210px;}
.brk .bb{flex:1;height:8px;background:var(--chipBg);border-radius:999px;overflow:hidden;}
.brk .bb>i{display:block;height:100%;background:var(--okTx);}
.brk.mid .bb>i{background:var(--warnTx);}
.brk.low .bb>i{background:var(--errTx);}
.brk .bv{flex:0 0 44px;text-align:left;font-variant-numeric:tabular-nums;color:var(--muted);}
@media (max-width:540px){
  .wrap{padding:16px 14px 48px;} .card{padding:16px;} .qtext{font-size:16px;}
  header h1{font-size:19px;} .pbtn{width:29px;height:29px;font-size:11.5px;}
  .opt{padding:11px 12px;} .stats{gap:11px;font-size:13px;}
  .brk .bl{flex-basis:130px;font-size:12.5px;}
}

/* ---------- תצוגת הדפסה של השאלות ---------- */
#print{display:none;}
.pq{break-inside:avoid;margin-bottom:9px;}
.pq .pn{font-weight:700;color:var(--accent);}
.pq .po{margin:1px 0 0 0;padding-right:15px;}
.pq .pa{color:var(--okTx);font-weight:600;}
.pq .pe{color:var(--muted);}
.prhead{display:none;}
@media print{
  @page{size:A4;margin:11mm 10mm;}
  html,body{background:#fff!important;color:#000!important;}
  html{--accent:#0f5a54;--muted:#444;--okTx:#0a5c22;--border:#bbb;}
  .wrap{max-width:none;padding:0;}
  header,#app,.foot{display:none!important;}
  #print{display:block!important;font-size:9.6pt;line-height:1.34;}
  #print.cols{column-count:2;column-gap:8mm;column-rule:1px solid #ccc;}
  .prhead{display:block;border-bottom:1.5px solid #000;padding-bottom:2mm;
    margin-bottom:3mm;column-span:all;}
  .prhead h2{font-size:13pt;margin:0;}
  .prhead div{font-size:8.6pt;color:#444;margin-top:1mm;}
  .pq{margin-bottom:2.6mm;}
  .pq .pt{font-size:7.6pt;color:#666;}
  .pq .pe{font-size:8.8pt;}
  /* שאלות, ואחריהן מפתח תשובות והסברים בעמוד נפרד */
  .pcols,.pkey{column-count:2;column-gap:8mm;column-rule:1px solid #ccc;}
  .pkey{break-before:page;page-break-before:always;}
  .pkey h3{column-span:all;font-size:12pt;margin:0 0 3mm;padding-bottom:2mm;border-bottom:1.5px solid #000;}
  .pk{break-inside:avoid;margin-bottom:2.2mm;font-size:8.8pt;}
  .pkall{column-span:all;font-weight:600;padding-bottom:2mm;border-bottom:1px solid #ccc;}
  .pk b{color:var(--accent);}
  .pk .pe{color:var(--muted);}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>בוחן תרגול — מסכת אבות בראייה היסטורית ועכשווית</h1>

<div class="foot" style="text-align:center;color:var(--muted);font-size:12px;margin-top:24px;">
  לתרגול לימודי בלבד · נבנה מהמצגות ומהסיכומים של יחידות הקורס ומהמפגשים בזום (ד״ר חגית עמרני, עולמות, בר־אילן, תשפ״ז)

<script>
var BANK=[
/* יחידה 1 – מבוא לתורה שבכתב ולתורה שבעל-פה */
/* מעמד הר סיני */
{l:1,t:"מעמד הר סיני",s:"סיכום",q:"לפי המסורת היהודית כפי שהיא מוצגת ביחידה, מתי הופיע הקב״ה בהר סיני ונתן את התורה לעם ישראל?",o:["לפני יותר מ-3,300 שנה","לפני כ-1,800 שנה, בימי המשנה","לפני יותר מ-3,800 שנה","לפני כ-2,000 שנה"],c:0,e:"הסיכום (חלק א) ושקף 4: «לפני יותר מ-3,300 שנה הופיע הקב״ה בהר סיני ונתן את התורה לעמו ישראל». כ-1,800 שנה מתאים לימי המשנה (200 לספירה), ו-3,800 שנה מתאים יותר לעקידת יצחק, שקודמת למתן תורה בציר הזמן (שקף 3)."},
{l:1,t:"מעמד הר סיני",s:"שאלות חזרה",q:"שאלת חזרה: במה ייחודי מעמד הר סיני לעומת מסורות ההתגלות בדתות אחרות, לפי הסיכום?",o:["ההתגלות נמסרה בכתב בו במקום, ולא כעדות מאב לבן","ההתגלות אירעה לעיני כל ישראל, ולא לנביא יחיד שראה, שמע או חלם","ההתגלות הייתה לנביא אחד, אך תוארה בפירוט רב יותר מבכל דת אחרת","ההתגלות אירעה בחלום שחלמו כל זקני ישראל יחד באותו הלילה"],c:1,e:"הסיכום (חלק א, «ייחודו של מעמד הר סיני») ושקף 5: כל הדתות מבוססות על נביא שראה, שמע או חלם את דבר האלוהים, ואילו ביהדות ההתגלות אירעה לעיני כל ישראל. העדות דווקא מועברת מאב לבן, ולכן האפשרות על כתיבה מיידית שגויה."},
{l:1,t:"מעמד הר סיני",s:"סיכום",q:"לפי היחידה, כמה איש היו שותפים למעמד הר סיני, לא כולל נשים וטף?",o:["כשלושה מיליון איש","כ-300,000 איש","600,000 איש","כ-63,000 איש"],c:2,e:"הסיכום (חלק א) ושקף 5: במעמד היו 600,000 איש, לא כולל נשים וטף. «כשלושה מיליון איש» הוא האומדן הכולל יחד עם הנשים והטף, ולכן אינו עונה על השאלה."},
{l:1,t:"מעמד הר סיני",s:"סיכום",q:"משה אומר לעם: «רק הישמר לך ושמור נפשך מאוד פן תשכח את הדברים אשר ראו עיניך... והודעתם לבניך ולבני בניך» (דברים ד, ט-י). מה הוא מצווה בפסוקים אלה?",o:["לכתוב את התורה ולמסור אותה לכוהנים בני לוי למשמרת","לעמוד מרחוק מן ההר ולא לגשת אל הערפל אשר שם האלוהים","לקרוא בתורה בציבור בשבתות, בחגים ובימי שני וחמישי","לזכור את מעמד הר סיני ולספר עליו לבנים ולבני הבנים"],c:3,e:"הסיכום (חלק א, «שמירת הברית») ושקף 6: משה מזהיר שלא ישכחו את מעמד הר סיני, ומצווה לספר עליו לדורות הבאים ולשמור את הברית ואת התורה. כתיבת התורה ומסירתה לכוהנים מופיעה בפסוק אחר (דברים לא, ט, חלק ד)."},
{l:1,t:"מעמד הר סיני",s:"סיכום",q:"לפי היחידה, מה מעמדה של זכירת מעמד הר סיני?",o:["מצווה שעם ישראל מוזהר עליה","מנהג שהתקבל בימי אנשי כנסת הגדולה","תקנה של רבי יהודה הנשיא בעת חתימת המשנה","העיקר השמיני ברשימת העיקרים של הרמב״ם"],c:0,e:"הסיכום (חלק א) ושקף 6: «זכירת מעמד הר סיני היא מצווה», ועם ישראל מוזהר לשמור בזיכרונו את רישומו של מעמד מתן תורה. העיקר השמיני של הרמב״ם הוא «תורה מן השמיים», לא זכירת המעמד."},
{l:1,t:"מעמד הר סיני",s:"סיכום",q:"מה מהבאים אינו מופיע בתיאור מעמד הר סיני בפסוקי שמות כ, יד-יח שמובאים ביחידה?",o:["העם רואה את הקולות ואת הלפידים","גשם עז היורד על ההר","קול השופר","ההר עשן והעם עומד מרחוק"],c:1,e:"הפסוק בסיכום (חלק א) ובשקף 4: «וכל העם רואים את הקולות ואת הלפידים ואת קול השופר ואת ההר עשן... ויעמדו מרחוק». גשם אינו נזכר בפסוקים, ואילו שלוש האפשרויות האחרות לקוחות מהם ישירות."},
{l:1,t:"מעמד הר סיני",s:"סיכום",q:"לפי פסוקי שמות כ שמובאים ביחידה, איזה טעם נותן משה לעם לכך שהאלוהים בא אליהם בהר סיני?",o:["כדי שהעם יבקש שמשה ידבר עמו","כדי למסור לעם את התורה שבעל-פה לפני התורה שבכתב","כדי לנסות אותם, ושתהיה יראתו על פניהם לבלתי יחטאו","כדי לכרות ברית עם הנביאים ועם אנשי כנסת הגדולה"],c:2,e:"בפסוק שבסיכום (חלק א): «אל תיראו, כי לבעבור נסות אתכם בא האלוהים, ובעבור תהיה יראתו על פניכם לבלתי תחטאו». הבקשה «דבר אתה עמנו» היא תגובת העם מתוך פחד, ולא הטעם שנותן משה."},
/* שתי תורות: שבכתב ושבעל-פה */
{l:1,t:"שתי תורות: שבכתב ושבעל-פה",s:"שאלות חזרה",q:"שאלת חזרה: מה מלמדת המילה «והתורות» בפסוק «אלה החוקים והמשפטים והתורות... בהר סיני ביד משה» (ויקרא כו, מו)?",o:["שהתורה שבעל-פה נוספה לתורה שבכתב בדורות שאחרי משה","שחמשת החומשים ניתנו בסיני כחמש תורות נפרדות זו מזו","שהחוקים והמשפטים ניתנו בשני מעמדות שונים","שמשה קיבל בסיני שתי תורות, שבכתב ושבעל-פה, יחד"],c:3,e:"הסיכום (חלק ב) ושקף 7: בפסוק לא כתוב «תורה» אלא «תורות», ומכאן שמשה קיבל בהר סיני שתי תורות, שבכתב ושבעל-פה, והן נמסרו יחד. הטענה שהתושב״ע נוספה בדורות מאוחרים סותרת את הקביעה שהיא נמסרה עם נתינת התורה שבכתב."},
{l:1,t:"שתי תורות: שבכתב ושבעל-פה",s:"סיכום",q:"סטודנט טוען שהצורה «תורות» במקום «תורה» (ויקרא כו, מו) היא עניין של סגנון בלבד. על איזה עיקרון נשענת היחידה כדי ללמוד ממנה על שתי תורות?",o:["«אין מילה ואין אות מיותרת בתורה»","«כל מצוה שנתן הקב״ה למשה, נתן לו את פירושה»","«התורה אינה ניתנת לשינוי או להמרה»","התורה נמצאת בידי כל ישראל «על נוסח אחד בלי שינוי»"],c:0,e:"הסיכום (חלק ב) ושקף 7: «אין מילה ואין אות מיותרת בתורה», ולכן הצורה «תורות» מלמדת על שתי תורות. «כל מצוה... נתן לו את פירושה» מתאר את היחס בין מצווה לפירושה, אבל אינו העיקרון שממנו נלמדת המילה."},
{l:1,t:"שתי תורות: שבכתב ושבעל-פה",s:"סיכום",q:"מה מהבאים אינו אחד מחמשת חומשי התורה, שהם התורה שבכתב לפי היחידה?",o:["בראשית","זרעים","ויקרא","במדבר"],c:1,e:"הסיכום (חלק ב) ושקף 8: התורה שבכתב היא חמשה חומשי תורה – בראשית, שמות, ויקרא, במדבר, דברים. «זרעים» הוא שם הסדר הראשון בששה סדרי המשנה (זמ״ן נק״ט), כלומר חלק מהתושב״ע שהועלתה על הכתב."},
{l:1,t:"שתי תורות: שבכתב ושבעל-פה",s:"סיכום",q:"סטודנטית כותבת: «התורה שבעל-פה היא תוספת חיצונית שחכמים צירפו לתורה שבכתב». לפי היחידה, מה נכון?",o:["התושב״ע נוספה בבתי המדרש, אך קיבלה מעמד מחייב בעת חתימת המשנה","התושב״ע היא אכן תוספת, אך היא נמסרה לכוהנים יחד עם ספר התורה","התושב״ע היא הפירוש המוסמך של הכתוב, והוא נמסר עם התורה שבכתב","התושב״ע נכתבה בידי משה בספר נפרד, ולכן אין היא תוספת של חכמים"],c:2,e:"הסיכום (חלק ב) ושקף 9: «כל מצוה שנתן הקב״ה למשה, נתן לו את פירושה»; התושב״ע «אינה תוספת חיצונית לתורה שבכתב, אלא הפירוש המוסמך של הכתוב», ופירוש זה נמסר עם נתינת התורה שבכתב. היא נמסרה בעל-פה, לא בספר נפרד."},
{l:1,t:"שתי תורות: שבכתב ושבעל-פה",s:"סיכום",q:"איזה פסוק מביאה היחידה כמקור למצוות תפילין, מצווה שהתורה שבכתב אינה מפרטת כיצד לקיימה?",o:["«בסוכות תשבו שבעת ימים»","«והודעתם לבניך ולבני בניך – יום אשר עמדת לפני ה׳ אלוהיך»","«ויכתוב משה את התורה הזאת ויתנה אל הכוהנים בני לוי»","«וקשרתם לאות על ידך והיו לטוטפות בין עיניך»"],c:3,e:"הסיכום (חלק ב, דוגמה 1) ושקף 10: «וקשרתם לאות על ידך והיו לטוטפות בין עיניך» (דברים ו, ח). «בסוכות תשבו» הוא הפסוק של הדוגמה השנייה, מצוות הישיבה בסוכה (ויקרא כג, מב)."},
{l:1,t:"שתי תורות: שבכתב ושבעל-פה",s:"סיכום",q:"לפי התורה שבעל-פה כפי שהיא מוצגת ביחידה, מה כתוב בתפילין ועל מה?",o:["4 פרשיות, בדיו על קלף מעור של בהמה טהורה","2 פרשיות, אחת לכל בית, על קלף","5 פרשיות, כמניין חומשי התורה","4 פרשיות, חרוטות על דופנות הבתים מבחוץ"],c:0,e:"הסיכום (חלק ב) ושקף 10: בתפילין 4 פרשיות כתובות בדיו על קלף מעור של בהמה טהורה – «שמע ישראל», «והיה אם שמוע», «קדש לי», «והיה כי יביאך». המספר 2 מתייחס לבתים עם רצועות העור, לא לפרשיות."},
{l:1,t:"שתי תורות: שבכתב ושבעל-פה",s:"סיכום",q:"לפי היחידה, מדוע מניחים את שני בתי התפילין על המצח ועל הזרוע השמאלית?",o:["המצח כנגד התורה שבכתב, והזרוע כנגד התורה שבעל-פה שנמסרה עמה","המצח קרוב למוח, משכן השכל, והזרוע קרובה ללב, משכן הרגש","שני הבתים הם כנגד שני לוחות הברית","הראש כנגד משה שקיבל את התורה, והזרוע כנגד יהושע שקיבל ממנו"],c:1,e:"הסיכום (חלק ב) ושקף 10: את הבתים מניחים «על המצח, קרוב למוח (משכן השכל), ועל הזרוע השמאלית, קרוב ללב (משכן הרגש)». החלוקה לשתי תורות או לשני לוחות אינה הטעם שמובא ביחידה."},
{l:1,t:"שתי תורות: שבכתב ושבעל-פה",s:"שאלות חזרה",q:"שאלת חזרה: מה מהבאים אינו אחת השאלות על התפילין שהיחידה מציינת שהתורה שבכתב אינה עונה עליהן?",o:["מה צבען של התפילין?","מה יוכנס בתוך התפילין?","כמה דפנות יש לתפילין?","כיצד מניחים את התפילין?"],c:2,e:"הסיכום (חלק ב) ושקף 10 מונים: מה לקשור, היכן לקשור, מה צורתן, מה צבען, מה יוכנס בהן וכיצד להניחן. שאלת מספר הדפנות שייכת לדוגמת הסוכה («בעלת כמה דפנות צריכה להיות?»), לא לתפילין."},
{l:1,t:"שתי תורות: שבכתב ושבעל-פה",s:"סיכום",q:"מה מהבאים אינו אחד הדינים שנמסרו למשה בעל-פה בעניין הסוכה, לפי היחידה?",o:["הסוכה חובה על הגברים ולא על הנשים","אין החולים והולכי הדרכים חייבים בה","הסכך מן הצומח, וגובהה לפחות 10 טפחים","האכילה בה בשלושת ימי החג הראשונים"],c:3,e:"הסיכום (חלק ב) ושקף 11: «האכילה, השתייה והשינה – בסוכה, כל 7 ימי החג», ולא בשלושת הימים הראשונים. שאר הדינים – חובת הגברים, פטור החולים והולכי הדרכים, סכך מן הצומח וגובה של 10 טפחים – נמנים במפורש."},
{l:1,t:"שתי תורות: שבכתב ושבעל-פה",s:"סיכום",q:"לפי מה שנמסר למשה בעל-פה, מה הגובה המזערי של סוכה?",o:["20 טפחים","7 טפחים","10 טפחים","4 טפחים"],c:2,e:"הסיכום (חלק ב) ושקף 11: «לא יהא גובה הסוכה פחות מ-10 טפחים». המספר 7 מופיע בהקשר אחר: שבעת ימי החג, שבהם האכילה, השתייה והשינה בסוכה."},
{l:1,t:"שתי תורות: שבכתב ושבעל-פה",s:"סיכום",q:"לפי היחידה, מדוע «היינו עדים לסוכות שונות» אילו בנו את הסוכה רק על פי התורה שבכתב?",o:["כי הכתוב אינו מפרט מה גודלה, כמה דפנות לה ואיזה סכך מותר להניח עליה","כי מסורות בתי המדרש אינן תואמות זו את זו, ואין סנהדרין שמכריעה","כי הכתוב מפרט את מידות הסוכה, אך כל קהילה מודדת טפחים אחרת","כי התורה שבכתב נמסרה לכוהנים, ושאר העם לא הכיר את דיניה"],c:0,e:"הסיכום (חלק ב, דוגמה 2) ושקף 11: התורה אינה מפרטת מה גודל הסוכה, כמה דפנות לה ואיזה סכך מותר, וגם «תשבו» פתוח לפרשנויות. החשש ממסורות שאינן תואמות בלי סנהדרין שמכריעה שייך לנימוקי רבי יהודה הנשיא (חלק ה)."},
/* הרמב״ם ושלושה עשר העיקרים */
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"סיכום",q:"לפי היחידה, באיזו מאה חי הרמב״ם?",o:["במאה ה-13","במאה ה-12","במאה ה-2 לספירה","במאה ה-16"],c:1,e:"הסיכום (חלק ג) ושקף 12: רבי משה בן מימון «חי במאה ה-12». במאה ה-13 חי כנראה דניאל בן יהודה דיין, מחבר הפיוט «יגדל» (קובץ העיקרים), וב-200 לספירה נכתבה המשנה."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"סיכום",q:"על מי נאמר «ממשה עד משה לא קם כמשה», לפי היחידה?",o:["על משה רבנו, שנבואתו עליונה על כל הנבואות","על רבי יהודה הנשיא, עורך המשנה ונשיא הסנהדרין","על הרמב״ם, רבי משה בן מימון","על דניאל בן יהודה דיין"],c:2,e:"הסיכום (חלק ג) ושקף 12: על הרמב״ם נאמר «ממשה עד משה לא קם כמשה», והוא הוכתר בכינוי «הנשר הגדול». עליונות נבואת משה רבנו היא העיקר השביעי; האמרה רק משווה את הרמב״ם אליו."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"סיכום",q:"מה מהבאים אינו נכון לגבי הרמב״ם, לפי היחידה?",o:["נולד בקורדובה שבספרד ונדד למרוקו, לעכו ולמצרים","היה מגדולי הפוסקים, איש מדע ורופא","הוכתר בכינוי «הנשר הגדול»","חיבר באיטליה את הפיוט «יגדל»"],c:3,e:"הסיכום (חלק ג) ושקף 12: הרמב״ם נולד בקורדובה שבספרד ונדד למרוקו, לעכו ולמצרים; היה מגדולי הפוסקים, איש מדע ורופא, והוכתר בכינוי «הנשר הגדול». את «יגדל» חיבר, כמקובל, דניאל בן יהודה דיין שחי באיטליה (קובץ העיקרים)."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"סיכום",q:"מהו היסוד השמיני בשלושה עשר העיקרים של הרמב״ם?",o:["התורה אינה ניתנת לשינוי או להמרה","עליונותה של נבואת משה על כל הנבואות","ממשותה של הנבואה – שכל דברי הנביאים אמת","תורה מן השמיים"],c:3,e:"הסיכום (חלק ג ומושגי המפתח) ושקף 13: היסוד השמיני הוא «תורה מן השמיים», והוא בבסיס היחידה. «התורה אינה ניתנת לשינוי או להמרה» הוא העיקר התשיעי, ועליונות נבואת משה היא העיקר השביעי."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"סיכום",q:"בניסוח היסוד השמיני כותב הרמב״ם שמשה «היה כמו סופר שקוראים לו». מה מבטא הדימוי?",o:["שמשה כתב את מה שהגיע אליו מאת ה׳, ולא חיבר מדעתו","שמשה כתב את התורה בסגנונו, לפי הבנתו","שמשה כתב את המצוות, והזקנים את הסיפורים","שמשה היה סופר שהעתיק ספרי תורה ומסר אותם לכוהנים"],c:0,e:"הסיכום (חלק ג) ושקף 14: התורה «כולה מפי הגבורה», ומשה היה כמו סופר שמכתיבים לו, «והוא כותב מאורעות כל הימים, הסיפורים והמצוות». גם בקובץ העיקרים: «משה לא כתב מעצמו אפילו אות אחת». לכן גם הסיפורים נכתבו בידי משה."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"שאלות חזרה",q:"שאלת חזרה: מה מעמדו של מי שכופר בתורה שבעל-פה, לפי הלכות תשובה של הרמב״ם המובאות ביחידה?",o:["הלכות תשובה דנות בכופר בתורה שבכתב, ולא בכופר בפירושה","גם לו אין חלק לעולם הבא, כמו לכופר בתורה שבכתב","הוא נחשב חוטא, אך יש לו חלק לעולם הבא כי לא כפר בכתוב","דינו נקבע בבית הדין שבדורו, לפי מנהג המקום"],c:1,e:"הסיכום (חלק ג, «הכופר בתורה») ושקף 15: «וכן הכופר בפירושה היא התושב״ע» – גם מי שאינו מאמין שהתורה שבעל-פה מן השמיים אין לו חלק לעולם הבא. לכן הטענה שהלכות תשובה עוסקות רק בכתוב שגויה."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"סיכום",q:"מה תוכנו של העיקר העשירי ברשימת שלושה עשר העיקרים של הרמב״ם?",o:["קדמותו של אלוהים – הוא ראשון והוא אחרון","האל מעניק שכר לצדיקים ונותן עונש לרשעים","השגחה פרטית – אלוהים יודע כל מעשי בני האדם","ממשותה של הנבואה – שכל דברי הנביאים אמת"],c:2,e:"הסיכום (חלק ג) ושקף 13: העיקר העשירי (י) הוא קיומה של השגחה פרטית – אלוהים יודע כל מעשה בני האדם וכל מחשבותיהם. שכר לצדיקים ועונש לרשעים הוא העיקר הסמוך, האחד עשר, וקדמות אלוהים היא העיקר הרביעי."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"סיכום",q:"מה מהבאים אינו אחד משלושה עשר עיקרי האמונה של הרמב״ם?",o:["אי-גשמיותו של אלוהים","האמונה בביאת המשיח, ואף על פי שיתמהמה","תחיית המתים בעת שיעלה רצון מאת ה׳","זכירת מעמד הר סיני כמצווה"],c:3,e:"לפי הסיכום (חלק א) ושקף 6 זכירת מעמד הר סיני היא מצווה, אבל אינה אחד העיקרים. ברשימת העיקרים (סיכום חלק ג, שקף 13) מופיעים אי-גשמיות אלוהים (ג), ביאת המשיח (יב) ותחיית המתים (יג)."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"קובץ העיקרים",q:"לפי החומר על שלושה עשר העיקרים והפיוט «יגדל», לאילו שלוש קבוצות ניתן לחלק את העיקרים?",o:["מציאות אלוהים ואחדותו; תורה מן השמים ונבואה; קשר בין אלוהים ואדם","אחדות אלוהים וקדמותו; התורה שבכתב ושבעל-פה; שכר ועונש בעולם הבא","מציאות אלוהים ונבואה; מצוות התורה ופירושן; ביאת המשיח","אמונה באלוהים; מצוות שבין אדם למקום; מצוות שבין אדם לחברו"],c:0,e:"בקובץ «שלושה עשר העיקרים והפיוט יגדל אלוהים חי»: ניתן לחלק את העיקרים לשלוש קבוצות – מציאות אלוהים ואחדותו; תורה מן השמים ונבואה; קשר בין אלוהים ואדם. החלוקה לשבכתב ושבעל-פה שייכת לנושא שתי התורות, לא לקבוצות העיקרים."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"קובץ העיקרים",q:"מי מקובל כמחברו של הפיוט «יגדל אלוהים חי»?",o:["הרמב״ם, שניסח את שלושה עשר העיקרים","דניאל בן יהודה דיין, שחי באיטליה","ר׳ יוסף אלבו, בעל «ספר העיקרים»","רבי יהודה הנשיא, עורך המשנה"],c:1,e:"בקובץ העיקרים: מקובל שמחבר הפיוט «יגדל» הוא דניאל בן יהודה דיין, שחי באיטליה, כנראה במאה ה-13. הפיוט מבוסס על שלושה עשר העיקרים שקבע הרמב״ם, אבל הרמב״ם אינו מחברו."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"קובץ העיקרים",q:"מה נכון לגבי מבנה הפיוט «יגדל», לפי החומר על העיקרים?",o:["13 שורות, אחת לכל עיקר, ובנוסח האשכנזים עוד שני חרוזים בסופו","3 בתים, אחד לכל קבוצת עיקרים, ובסופם חרוז על תורת משה","13 שורות, אחת לכל עיקר, ובנוסח הספרדים עוד שני חרוזים בסופו","26 שורות, שתיים לכל עיקר: שורת הפיוט ושורת הפירוש"],c:2,e:"בקובץ העיקרים: «בפיוט 13 שורות, אחת לכל אחד מהעיקרים, בנוסח הספרדים יש בסוף הפיוט עוד שני חרוזים». התוספת שייכת לנוסח הספרדים, לא לנוסח האשכנזים, והשורות אינן מחולקות לפי שלוש הקבוצות."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"קובץ העיקרים",q:"מתי מושר הפיוט «יגדל» ברוב קהילות ישראל, לפי החומר על העיקרים?",o:["בתפילת שחרית של יום חול, לאחר הנחת התפילין","בשבתות ובימי שני וחמישי, לפני קריאת התורה","בחג הסוכות, בעת הישיבה בסוכה","בליל שבת וחג, לאחר סיום תפילת ערבית"],c:3,e:"בקובץ העיקרים: הפיוט התקבל בכל התפוצות אך זמן אמירתו שונה מקהילה לקהילה, וברוב הקהילות הוא מושר «בליל שבת וחג לאחר סיום תפילת ערבית». שחרית של יום חול היא זמן הנחת התפילין (סיכום, חלק ב)."},
{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"קובץ העיקרים",q:"בפיוט «יגדל» שרים: «תורת אמת נתן לעמו אל, על יד נביאו נאמן ביתו». לאיזה עיקר של הרמב״ם מכוונת שורה זו?",o:["תורה מן השמיים","עליונותה של נבואת משה","ממשותה של הנבואה","אחדות האל"],c:0,e:"זו השורה השמינית בפיוט, ובקובץ העיקרים היא מוסברת כ«תורה מן השמים»: חמשת החומשים הם העתקה שהעתיק משה מדברי ה׳. עליונות נבואת משה (העיקר השביעי) מופיעה בשורה הקודמת: «לא קם בישראל כמשה עוד»."},
/* שרשרת המסירה */
{l:1,t:"שרשרת המסירה",s:"סיכום",q:"לפי היחידה, מדוע שוחררו הכוהנים בני שבט לוי מכל עול שקיבלו אזרחי הארץ, ולא קיבלו נחלה?",o:["כי הם שימשו דיינים בסנהדרין שהכריעה בענייני הלכה","כי הם לימדו את עם ישראל את התורה שבכתב","כי הם קיבלו את התושב״ע מן הנביאים ומסרו אותה הלאה","כי הם כתבו ספר תורה לכל שבט ושבט"],c:1,e:"הסיכום (חלק ד) ושקף 16: «הכוהנים בני שבט לוי לימדו את עם ישראל את התורה שבכתב. לכן שוחררו מכל עול שקיבלו אזרחי הארץ, ובשל כך לא קיבלו נחלה». את התושב״ע קיבלו מן הנביאים אנשי כנסת הגדולה, לא הכוהנים."},
{l:1,t:"שרשרת המסירה",s:"סיכום",q:"לפי היחידה, באיזה אופן נעשה לימוד התורה שבכתב בציבור, מאז ועד היום?",o:["קריאה בציבור בליל שבת וחג, לאחר תפילת ערבית","קריאה בציבור בכל שבעת ימי חג הסוכות","קריאה בציבור בשבתות, בחגים ובימי שני וחמישי","קריאה בציבור בבית הוועד לחכמים שבכל דור ודור"],c:2,e:"הסיכום (חלק ד) ושקף 16: «לימוד התורה, מאז ועד היום, נעשה על ידי קריאתה בציבור בשבתות, בחגים ובימי שני וחמישי». ליל שבת וחג לאחר ערבית הוא הזמן שבו מושר הפיוט «יגדל» ברוב הקהילות."},
{l:1,t:"שרשרת המסירה",s:"סיכום",q:"לפי ר׳ יוסף אלבו בספר העיקרים, מהי הראיה לכך שהתורה שמורה בידינו כמו שניתנה למשה, בלי שינוי?",o:["שהיסוד השמיני של הרמב״ם קובע שהיא כולה מפי הגבורה","שבית הדין שבכל דור בדק את דיוקה והכריע במחלוקות","שהכוהנים בני לוי שמרו אותה בארון ברית ה׳","שהיא נמצאת בידי כל ישראל המפוזרים בעולם על נוסח אחד"],c:3,e:"הסיכום (חלק ד) ושקף 16, בשם ר׳ יוסף אלבו (ספר העיקרים ג, כב): «והראיה שהיא נמצאת היום ביד כל ישראל המפוזרים בכל העולם... על נוסח אחד בלי שינוי». היסוד השמיני של הרמב״ם הוא עיקר אמונה, לא הראיה שאלבו מביא."},
{l:1,t:"שרשרת המסירה",s:"סיכום",q:"מהו הסדר הנכון של שרשרת המסירה של התורה שבעל-פה לפי אבות א, א?",o:["משה, יהושע, נביאים, זקנים, אנשי כנסת הגדולה","משה, זקנים, יהושע, נביאים, אנשי כנסת הגדולה","משה, יהושע, זקנים, אנשי כנסת הגדולה, נביאים","משה, יהושע, זקנים, נביאים, אנשי כנסת הגדולה"],c:3,e:"הסיכום (חלק ד) ושקף 17: «משה קיבל תורה מסיני, ומסרה ליהושע, ויהושע לזקנים, וזקנים לנביאים, ונביאים מסרוה לאנשי כנסת הגדולה». הזקנים קודמים לנביאים, ואנשי כנסת הגדולה הם החוליה האחרונה ברשימה."},
{l:1,t:"שרשרת המסירה",s:"שאלות חזרה",q:"שאלת חזרה: מה מהבאים אינו חוליה בשרשרת המסירה של התורה שבעל-פה כפי שהיא מופיעה באבות א, א?",o:["הכוהנים בני לוי","יהושע","הזקנים","אנשי כנסת הגדולה"],c:0,e:"הסיכום (חלק ד) ושקף 17: החוליות הן משה, יהושע, הזקנים, הנביאים ואנשי כנסת הגדולה. הכוהנים בני לוי קיבלו ממשה את התורה שבכתב למשמרת (דברים לא, ט), אבל אינם חוליה בשרשרת שבאבות א, א."},
{l:1,t:"שרשרת המסירה",s:"סיכום",q:"לפי היחידה, במשך כמה שנים בערך שינן עם ישראל את התורה שבעל-פה ומסר אותה בעל-פה, עד שהועלתה על הכתב?",o:["כ-3,300 שנה","כ-1,500 שנה","כ-1,000 שנה","כ-600 שנה"],c:1,e:"הסיכום (חלק ד) ושקף 18: עם ישראל שינן והעביר את התושב״ע «במשך כ-1,500 שנים», עד שהועלתה על הכתב בשנת 200 לספירה. 3,300 שנה הוא הזמן שחלף מאז מתן תורה ועד ימינו, לא תקופת המסירה בעל-פה."},
{l:1,t:"שרשרת המסירה",s:"סיכום",q:"מה מהבאים אינו תיאור נכון של התפתחות התושב״ע בתקופת המסירה בעל-פה, לפי היחידה?",o:["נוצרו מדרשי הלכה ומדרשי אגדה","כל בית מדרש בכל דור העמיק והרחיב את לימודה","נשמרה בסוד בידי הכוהנים ולא נפוצה בעם","התרבו ההלכות עצמן ותחומי העיסוק שלה"],c:2,e:"הסיכום (חלק ד) ושקף 18: התושב״ע נלמדה בידי החכמים «ונפוצה בקרב העם כולו»; כל בית מדרש העמיק והרחיב את לימודה, נוצרו מדרשי הלכה ומדרשי אגדה והתרבו ההלכות. לכן הטענה שנשמרה בסוד בידי הכוהנים שגויה."},
{l:1,t:"שרשרת המסירה",s:"מצגת",q:"בשקף 17 מודגשים הפעלים «קיבל» ו«מסר» בשרשרת המסירה. מה הם מבטאים?",o:["שכל חוליה הוסיפה לתורה פירוש משלה וחתמה אותו","שהמסירה נעשתה בכתב, מספר תורה אחד לספר הבא","שהתורה שבכתב נמסרה לכוהנים והתושב״ע לזקנים","שכל חוליה מקבלת את התורה ומוסרת אותה הלאה"],c:3,e:"שקף 17: «קיבל» ← «מסר» – כל חוליה מקבלת ומוסרת הלאה. המסירה הייתה בעל-פה, «מדור לדור ומחכם לחכם» (סיכום, חלק ד; שקף 18), ולא מספר לספר, ואין בשקף טענה שכל חוליה חתמה פירוש משלה."},
{l:1,t:"שרשרת המסירה",s:"מצגת",q:"לפי ציר הזמן בשקף 3 («תקופות בתולדות התושב״ע»), איזו תקופה מופיעה בין תקופת אנשי כנסת הגדולה לבין תקופת התנאים?",o:["הזוגות","הנביאים והמלכים","האמוראים","הסבוראים"],c:0,e:"שקף 3 מונה את התקופות: ... נביאים ומלכים, אנשי כנסת הגדולה, הזוגות, תנאים, אמוראים, סבוראים, גאונים, ראשונים, אחרונים. הנביאים והמלכים קודמים לאנשי כנסת הגדולה, והאמוראים והסבוראים באים אחרי התנאים."},
/* המשנה ורבי יהודה הנשיא */
{l:1,t:"המשנה ורבי יהודה הנשיא",s:"סיכום",q:"לפי היחידה, מתי הועלתה התורה שבעל-פה על הכתב בידי רבי יהודה הנשיא?",o:["בשנת 500 לספירה","בשנת 200 לספירה","במאה ה-12","בסמוך לחורבן בית 2"],c:1,e:"הסיכום (חלק ד) ושקף 18: התושב״ע הועלתה על הכתב «בשנת 200 לספירה בידי רבי יהודה הנשיא – אחרון התנאים», וגם בציר הזמן (שקף 3) 200 היא חתימת המשנה. 500 לספירה היא בציר הזמן חתימת התלמוד הבבלי."},
{l:1,t:"המשנה ורבי יהודה הנשיא",s:"סיכום",q:"מה מהבאים אינו אחת הסיבות שבגללן היה צורך לכתוב את התורה שבעל-פה, לפי היחידה?",o:["ריבוי החומר של התושב״ע","אובדן עצמאותו של עם ישראל","בקשת הקיסר אנטונינוס","גזירות הרומאים שאסרו ללמוד תורה"],c:2,e:"הסיכום (חלק ה, «מדוע היה צורך לכתוב?») ושקף 19: בגלל ריבוי החומר ובשל נסיבות הזמן – אובדן העצמאות וגזירות הרומאים שאסרו ללמוד תורה. היחסים הטובים עם הקיסר אנטונינוס הם חלק מ«ההזדמנות ההיסטורית», ולא נזכרת שום בקשה שלו."},
{l:1,t:"המשנה ורבי יהודה הנשיא",s:"סיכום",q:"מה מתארת היחידה כ«הזדמנות ההיסטורית» שסייעה לרבי יהודה הנשיא לכתוב את התורה שבעל-פה?",o:["ניצחונו של מרד בר כוכבא, שהחזיר לעם את עצמאותו המדינית","סמכות הסנהדרין בגולה, שהכריעה בין מסורות בתי המדרש השונים","גזירות השמד, שבהן נהרגו תלמידי חכמים רבים, והחשש לגורל התורה","שלווה מדינית וכלכלית, יחסיו הטובים עם הקיסר אנטונינוס ועושרו"],c:3,e:"הסיכום (חלק ה, טבלת הנסיבות) ושקף 19: «הייתה שלווה מדינית וכלכלית. לרבי יהודה הנשיא היו יחסים טובים עם הקיסר אנטונינוס, ועושרו הרב סייע לו». ימי בר כוכבא וגזירות השמד שייכים ל«חשש לעתיד», לא להזדמנות."},
{l:1,t:"המשנה ורבי יהודה הנשיא",s:"שאלות חזרה",q:"שאלת חזרה: לפי היחידה, מדוע חשש רבי יהודה הנשיא שיהיו בעתיד «מסורות שאינן תואמות זו את זו»?",o:["כי בגלות תתפזר התושב״ע בבתי מדרש, ואין סנהדרין שתכריע","כי הכוהנים בני לוי הפסיקו ללמד את התורה שבכתב בציבור","כי אנשי כנסת הגדולה לא מסרו את התושב״ע לחכמי המשנה","כי החכמים החלו לחלוק על המשנה עוד לפני שנחתמה"],c:0,e:"הסיכום (חלק ה, «החשש לעתיד») ושקף 19: העם עתיד לצאת לגלות, והתושב״ע תתפזר בבתי מדרש שונים; «יהיו מסורות שאינן תואמות זו את זו, כי אין סנהדרין שמכריעה בענייני הלכה». לכן חיבר חיבור אחד שיהיה ביד כולם."},
{l:1,t:"המשנה ורבי יהודה הנשיא",s:"סיכום",q:"מה מהבאים אינו נכון לגבי רבי יהודה הנשיא, לפי היחידה?",o:["כונה «רבנו הקדוש» או «רבי»","היה ראשון האמוראים","היה נשיא הסנהדרין ועורך המשנה","היה תנא בדור החמישי והאחרון"],c:1,e:"הסיכום (חלק ה) ושקף 19: רבי יהודה הנשיא, «רבנו הקדוש» או «רבי», היה תנא (חכם משנה) בדור החמישי והאחרון, נשיא הסנהדרין ועורך המשנה. הוא אחרון התנאים; חתימת המשנה שלו היא שפתחה את תקופת האמוראים."},
{l:1,t:"המשנה ורבי יהודה הנשיא",s:"סיכום",q:"המובאה «ולמה עשה רבינו הקדוש כך ולא הניח לדבר כמות שהיה? לפי שראה שתלמידים מתמעטים והולכים...» לקוחה ממקור שמובא ביחידה. מהו?",o:["הלכות תשובה לרמב״ם","ספר העיקרים לר׳ יוסף אלבו","הקדמת הרמב״ם למשנה תורה","היסוד השמיני משלושה עשר העיקרים"],c:2,e:"הסיכום (חלק ה) ושקף 20: המובאה על חיבור המשנה בידי רבנו הקדוש לקוחה מ«הקדמת הרמב״ם למשנה תורה». הלכות תשובה הן המקור לדין הכופר בתורה (חלק ג), וספר העיקרים לר׳ יוסף אלבו מובא בעניין דיוק ספר התורה (חלק ד)."},
{l:1,t:"המשנה ורבי יהודה הנשיא",s:"סיכום",q:"כיצד, לפי היחידה, עבד רבי יהודה הנשיא בכתיבת התורה שבעל-פה?",o:["העתיק ספר כתוב שהיה בידי הכוהנים מימי משה רבנו","כינס את הסנהדרין והכריע בכל מחלוקת לפי רוב הדעות","אסף את פירושי האמוראים וסידר אותם בששה סדרים","בעזרת חכמי דורו קיבץ את החומר ההלכתי, מיין אותו וכתב"],c:3,e:"הסיכום (חלק ה, «דרך העבודה») ושקף 19: «בעזרת החכמים שחיו בדורו, קיבץ את כל החומר ההלכתי עד ימיו, מיין אותו, וכתב את התושב״ע», ומיין אותה לששה סדרים. האמוראים באו אחרי חתימת המשנה, ולכן לא יכול היה לסדר את פירושיהם."},
{l:1,t:"המשנה ורבי יהודה הנשיא",s:"סיכום",q:"מה משמעות חתימת המשנה מבחינת תקופות החכמים, לפי היחידה?",o:["היא סוגרת את תקופת האמוראים ופותחת את תקופת התנאים","היא סוגרת את תקופת הזוגות ופותחת את תקופת התנאים","היא סוגרת את תקופת התנאים ופותחת את תקופת האמוראים","היא סוגרת את תקופת הנביאים ופותחת את תקופת הגאונים"],c:2,e:"הסיכום (חלק ה, «משמעות חתימת המשנה»), מושגי המפתח ושקף 24: «עצם חתימת המשנה סוגרת את תקופת התנאים ומתחילה את תקופת האמוראים». התנאים הם חכמי המשנה, ולכן הם קודמים לאמוראים ולא להפך."},
{l:1,t:"המשנה ורבי יהודה הנשיא",s:"סיכום",q:"מה מהבאים אינו אחת המשמעויות של חתימת המשנה, לפי היחידה?",o:["המשנה נקראת בציבור בשבתות, בחגים ובימי שני וחמישי","נמנעו מלחלוק על דבריה ופסקו המחלוקות","המשנה הפכה לספר מקור שני בקדושתו לתורה","עיקר הלימוד של המשנה הוא פרשנותה"],c:0,e:"הסיכום (חלק ה) ושקף 24 מונים: סיום תקופת התנאים, הימנעות מלחלוק על דברי המשנה, מעמדה כספר מקור שני בקדושתו לתורה, ופרשנות המשנה כעיקר הלימוד. הקריאה בציבור בשבתות, בחגים ובימי שני וחמישי נאמרה על התורה שבכתב (חלק ד), לא על המשנה."},
/* מבנה המשנה וסדריה */
{l:1,t:"מבנה המשנה וסדריה",s:"סיכום",q:"לפי היחידה, כמה סדרים, מסכתות ופרקים יש במשנה?",o:["6 סדרים, 523 מסכתות, 63 פרקים","6 סדרים, 63 מסכתות, 523 פרקים","5 סדרים, 63 מסכתות, 523 פרקים","6 סדרים, 13 מסכתות, 600 פרקים"],c:1,e:"הסיכום (חלק ה, «מבנה המשנה») ושקף 21: 6 סדרים, 63 מסכתות ו-523 פרקים, וכל פרק נחלק למשניות (הלכות). המספר 5 שייך לחמשה חומשי התורה שבכתב, לא לסדרי המשנה."},
{l:1,t:"מבנה המשנה וסדריה",s:"סיכום",q:"מה פירוש ראשי התיבות זמ״ן נק״ט?",o:["זרעים, מועד, נזיקין, נשים, קודשים, טהרות","זבחים, מועד, נשים, נזיקין, קודשים, טהרות","זרעים, מועד, נשים, נזיקין, קודשים, טהרות","זרעים, מועד, נשים, נזיקין, קינים, טהרות"],c:2,e:"הסיכום (חלק ה ומושגי המפתח) ושקף 22: זמ״ן נק״ט = זרעים, מועד, נשים, נזיקין, קודשים, טהרות, בסדר הזה (נשים לפני נזיקין). זבחים וקינים הן מסכתות בסדר קודשים (שקף 23), לא שמות של סדרים."},
{l:1,t:"מבנה המשנה וסדריה",s:"סיכום",q:"תלמידה מבקשת ללמוד במשנה את דיני בית המקדש והקורבנות. לאיזה סדר עליה לפנות?",o:["נזיקין","מועד","טהרות","קודשים"],c:3,e:"הסיכום (חלק ה, טבלת הסדרים) ושקף 22: סדר קודשים עוסק ב«דיני בית המקדש והקורבנות». סדר טהרות עוסק בטומאה וטהרה, וסדר מועד בשבת, חג, מועד וצומות."},
{l:1,t:"מבנה המשנה וסדריה",s:"מצגת",q:"סטודנט שלמד ביחידה על מצוות ישיבה בסוכה רוצה למצוא את מסכת סוכה במשנה. לפי רשימת המסכתות בשקף 23, באיזה סדר היא נמצאת?",o:["מועד","זרעים","נזיקין","קודשים"],c:0,e:"שקף 23: מסכת סוכה נמנית בסדר מועד (12 מסכתות), לצד שבת, פסחים, יומא ועוד. זה מתאים לנושא הסדר בסיכום (חלק ה): «דיני הימים המיוחדים בשנה – שבת, חג, מועד וצומות»."},
{l:1,t:"מבנה המשנה וסדריה",s:"סיכום",q:"מה נושאו של סדר נזיקין, הסדר שבו נמצאת מסכת אבות?",o:["דיני אישות ומשפחה – נישואין וגירושין","דיני ממונות והליכי שיפוט – היחסים שבין אדם לחברו","דיני הימים המיוחדים בשנה – שבת, חג, מועד וצומות","דיני טומאה וטהרה – טהרת הגוף, הכלים והבית"],c:1,e:"הסיכום (חלק ה) ושקף 22: נזיקין עוסק ב«דיני ממונות והליכי שיפוט – עניינים המסדירים את היחסים שבין אדם לחברו». אישות ומשפחה הם נושא סדר נשים, הסמוך לו ברשימת זמ״ן נק״ט."},
{l:1,t:"מבנה המשנה וסדריה",s:"סיכום",q:"היכן נמצאת מסכת אבות במשנה, לפי היחידה?",o:["המסכת העשירית בסדר נזיקין","המסכת התשיעית בסדר קודשים","המסכת התשיעית בסדר נזיקין","המסכת הראשונה בסדר נזיקין"],c:2,e:"הסיכום (חלק ה, «מסכת אבות») ושקפים 23 ו-25: מסכת אבות היא «המסכת התשיעית שבסדר נזיקין». ברשימה בשקף 23 המסכת העשירית והאחרונה בנזיקין היא הוריות, והראשונה היא בבא קמא."},
{l:1,t:"מבנה המשנה וסדריה",s:"סיכום",q:"מה מייחד את מסכת אבות, לפי היחידה?",o:["היא עוסקת בדיני ממונות ובהליכי שיפוט בין אדם לחברו","היא נכתבה בידי משה ונמסרה ליהושע בכתב","היא המסכת הראשונה במשנה ופותחת את סדר זרעים","אין בה הלכה או מצווה, אלא ענייני מוסר ודרך ארץ"],c:3,e:"הסיכום (חלק ה) ושקף 25: «במסכת אבות אין שום הלכה או מצווה, אלא כולה ענייני מוסר ודרך ארץ, עצות להתנהגות טובה והוראות לדרך חיים ראויה». דיני ממונות הם נושא סדר נזיקין שבו היא נמצאת, לא תוכן המסכת עצמה."},
{l:1,t:"מבנה המשנה וסדריה",s:"מצגת",q:"לפי רשימת המסכתות בשקף 23, מה מהבאים אינו מסכת בסדר נזיקין?",o:["כתובות","סנהדרין","עבודה זרה","הוריות"],c:0,e:"שקף 23: בסדר נזיקין 10 מסכתות – בבא קמא, בבא מציעא, בבא בתרא, סנהדרין, מכות, שבועות, עדויות, עבודה זרה, אבות, הוריות. מסכת כתובות נמנית בסדר נשים, שעוסק בדיני אישות ומשפחה."},
{l:1,t:"מבנה המשנה וסדריה",s:"סיכום",q:"לפי היחידה, מפי מי נאמרו הדברים שבמסכת אבות?",o:["מפי משה רבנו, כפי שקיבל אותם בהר סיני","מפי חכמי המשנה, המכונים «אבות האומה»","מפי האמוראים, שפירשו את המשנה אחרי חתימתה","מפי האבות שבראש ציר הזמן, מימי עקידת יצחק"],c:1,e:"הסיכום (חלק ה) ושקף 25: ענייני המוסר שבמסכת «נאמרו מפי חכמי המשנה – אבות האומה». האמוראים פעלו אחרי חתימת המשנה, ולכן דבריהם אינם חלק ממנה; «אבות» שבראש ציר הזמן (שקף 3) אינם מקור המסכת."},
/* מפגש הזום הראשון (17.11.2026) – המצגת וההקלטה */
/* למה החכם אמר את מה שאמר */
{l:2,t:"למה החכם אמר את מה שאמר",s:"מפגש זום",q:"השלימו את המשפט מן השקף «השאלה הגדולה של הקורס»: «מאחורי כל אמרה עומד אדם – ומאחורי כל אדם עומדת…»",o:["תקופה","מסורת","שושלת","קהילה"],c:0,e:"מצגת המפגש, שקף 6, ומפגש 17.11, דקה 17: «מאחורי כל אמרה עומד אדם, מאחורי כל אדם עומדת תקופה – שלטון זר, מחלוקות, חורבן ותקומה». זה הבסיס לשאלה «מדוע החכם אמר את מה שאמר». «מסורת» מפתה בגלל שרשרת המסירה, אבל המשפט מדגיש את הרקע ההיסטורי."},
{l:2,t:"למה החכם אמר את מה שאמר",s:"מפגש זום",q:"בשקף «על מה הקורס?» מוצג תרשים זרימה של ארבעה שלבים שבהם נלמדת כל אמרה. מהו סדרם?",o:["האמרה ← התקופה ← ההלכה ← היום","החכם ← התקופה ← האמרה ← היום","האמרה ← החכם ← התקופה ← היום","התקופה ← החכם ← האמרה ← היום"],c:2,e:"מצגת המפגש, שקף 4, ומפגש 17.11, דקה 10: קודם האמרה (מה כתוב), אחר כך החכם (מי אמר), התקופה (מתי ולמה), ולבסוף היום (מה זה אומר לנו). מתחילים מן האמרה עצמה ולא מן הרקע; ו«הלכה» אינה שלב בתרשים, שהרי המסכת עוסקת במוסר ולא בהלכה."},
{l:2,t:"למה החכם אמר את מה שאמר",s:"מפגש זום",q:"המרצה הביאה כדוגמה את אמרת רבן שמעון בן גמליאל «כל ימי גדלתי בין החכמים ולא מצאתי לגוף טוב אלא שתיקה». מתי, לדבריה, נאמרה האמרה?",o:["בימי מרד בר כוכבא, בשנת 135 לספירה","בימי שיבת ציון, אחרי שפסקה הנבואה","בימי הזוגות, כשנהרגו חכמי הסנהדרין","ערב חורבן הבית השני, בשנת 70 לספירה"],c:3,e:"מפגש 17.11, דקות 13–16: רבן שמעון בן גמליאל חי בתקופת חורבן הבית השני, והאמרה נאמרה «ערב החורבן»; היא תילמד ביחידה 9. מרד בר כוכבא (135) מפתה כי גם בו נהרגו חכמים רבים, אבל הוא מאוחר יותר ושייך לרקע של כתיבת המשנה."},
{l:2,t:"למה החכם אמר את מה שאמר",s:"מפגש זום",q:"לפי ההסבר במפגש, מדוע ראה רבן שמעון בן גמליאל בשתיקה את הדרך הטובה ביותר בימיו?",o:["החכמים היו בסכנה משני הצדדים: מן הרומאים ומן הקנאים","החכמים פחדו מן הרומאים, ואילו הקנאים הם שהגנו עליהם","הסנהדרין אסרה על החכמים לדבר בענייני המרד ברבים","הצדוקים, ששלטו במקדש, רדפו כל חכם שלימד תורה ברבים"],c:0,e:"מפגש 17.11, דקות 14–16: מצד אחד הרומאים, שהיו הורגים חכם על כל מילה; מצד שני הקנאים והבריונים, ששרפו את האסמים כדי שהרעב יוציא את העם למלחמה, והטילו אימה על ירושלים. חכם שהתנגד למרד – הקנאים הרגוהו, ומי שתמך בו – הרומאים. הקנאים לא הגנו על החכמים; החכמים פחדו מהם."},
{l:2,t:"למה החכם אמר את מה שאמר",s:"מפגש זום",q:"מה מהבאים אינו צירוף נכון של אמרה ומקומה במסכת אבות, לפי מצגת המפגש?",o:["«עשה לך רב וקנה לך חבר» – אבות א, ו","«אם אין אני לי מי לי» – אבות א, יד","«הכל צפוי והרשות נתונה» – אבות א, א","«אל תאמין בעצמך עד יום מותך» – אבות ב, ד"],c:2,e:"מצגת המפגש, שקף 5: «הכל צפוי והרשות נתונה» היא אבות ג, טו, ואילו אבות א, א היא משנת שרשרת המסירה, «משה קיבל תורה מסיני» (שקף 7). שאר הצירופים מופיעים בשקף כפי שהם: א, ו; א, יד; ב, ד."},
/* הזוגות */
{l:2,t:"הזוגות",s:"מפגש זום",q:"לפי המפגש, מי היה בן זוגו של שמעון בן שטח בתקופת הזוגות?",o:["יהושע בן פרחיה","יהודה בן טבאי","אבטליון","רבי שמעון בר יוחאי"],c:1,e:"מפגש 17.11, דקה 26: «יש את שמעון בן שטח, היה אחד הזוגות, שהקולגה שלו, הזוג שלו, היה יהודה בן טבאי». יהושע בן פרחיה נזכר באותו משפט, אבל כחכם של זוג אחר; ורבי שמעון בר יוחאי הוא תנא מתלמידי רבי עקיבא, מאוחר בהרבה."},
{l:2,t:"הזוגות",s:"מפגש זום",q:"מה מהבאים אינו זוג מתקופת הזוגות, מאלה שהזכירה המרצה במפגש?",o:["הלל ושמאי","שמעיה ואבטליון","שמעון בן שטח ויהודה בן טבאי","רבי עקיבא ורבי מאיר"],c:3,e:"מפגש 17.11, דקה 26: «סך הכול היו חמישה זוגות»; המרצה מנתה את הלל ושמאי (המפורסמים שבהם), שמעיה ואבטליון, ושמעון בן שטח ויהודה בן טבאי. רבי עקיבא ותלמידו רבי מאיר הם תנאים, מן התקופה שאחרי הזוגות (דקות 39–40)."},
{l:2,t:"הזוגות",s:"מפגש זום",q:"לפי המרצה, בתקופות הזקנים, הנביאים, אנשי כנסת הגדולה והזוגות כמעט לא היו מחלוקות בהלכה. מתי, לדבריה, החלו המחלוקות?",o:["כשרבי יהודה הנשיא כתב את המשנה ופסק בה הלכה","כשלא הייתה סנהדרין שתכריע בין הדעות","כשאנשי כנסת הגדולה באו במקום הנביאים","כשהתלמוד הבבלי נחתם ונפתחה תקופת הגאונים"],c:1,e:"מפגש 17.11, דקות 30–31: בתקופות ההן «תמיד היו חכמים שהכריעו את ההלכה»; «מתי המחלוקות החלו? כשהסנהדרין לא הייתה» – כשנהרגו כמעט כל חכמיה, בימי הזוגות. רבי יהודה הנשיא דווקא הכריע במחלוקות ופסק הלכה, ולא פתח אותן."},
{l:2,t:"הזוגות",s:"מפגש זום",q:"בית שמאי ובית הלל נחלקו בהדלקת נרות חנוכה. כיצד הוכרעה ההלכה, ומדוע, לפי המפגש?",o:["כבית שמאי, שפוחתים נר בכל יום – כי «אחרי רבים להטות»","כבית הלל, שמוסיפים נר בכל יום – «מעלים בקודש ולא מורידים»","כבית הלל, שמוסיפים נר בכל יום – כי כך נהג רוב העם באותם ימים","כבית שמאי, שמתחילים בשמונה נרות ופוחתים – כי כך נהג רוב העם"],c:1,e:"מפגש 17.11, דקות 33–34: בית שמאי – שמונה נרות ביום הראשון ופוחתים; בית הלל – נר אחד ומוסיפים. רבי יהודה הנשיא ובית דינו פסקו כבית הלל, «כי מעלים בקודש ולא מורידים». העם היה חלוק חצי־חצי, ולכן הנימוק אינו מנהג הרוב."},
/* תנאים, אמוראים והתלמוד */
{l:1,t:"תנאים, אמוראים והתלמוד",s:"מפגש זום",q:"מה מקור השם «תנאים», לפי המפגש?",o:["«תנא» = «שנה» בהשפעת הארמית (ת׳ וש׳ מתחלפות): מי ששינן","«תנא» = «מתרגם» בארמית: מי שפירש את המשנה החתומה","«תנאי»: החכמים שהציבו תנאים לקבלת תלמידים לבית המדרש","«נתינה»: החכמים שנתנו את התורה שבעל פה לדור הבא"],c:0,e:"מפגש 17.11, דקות 25–26: «תנא מהמילה שנה, בהשפעת הארמית ת׳ וש׳ מתחלפות», ו«שנה» – לשנן; וגם אחרי שרבי יהודה הנשיא כתב את המשנה «עדיין החכמים שיננו». «מתרגם, מפרש» הוא דווקא פירוש השם «אמורא» (דקה 27)."},
{l:1,t:"תנאים, אמוראים והתלמוד",s:"מפגש זום",q:"מה פירוש הכינוי «אמורא», ועל מה עבדו האמוראים, לפי המפגש?",o:["משנן – הם שיננו בעל פה את התורה שבכתב","מתרגם, מפרש – הם פירשו את דברי המשנה החתומה","פוסק – הם הכריעו במחלוקות התנאים לפני חתימת המשנה","מוסר – הם קיבלו את התורה מן הנביאים ומסרו אותה"],c:1,e:"מפגש 17.11, דקה 27: אחרי חתימת המשנה «כבר אי אפשר להוסיף עליה», והחכמים שבאו אחריה «נקראים אמוראים... מתרגם, מפרש» את דברי המשנה החתומה. «משנן» הוא פירוש השם «תנא», וההכרעה לפני החתימה הייתה של רבי ובית דינו."},
{l:1,t:"תנאים, אמוראים והתלמוד",s:"מפגש זום",q:"מה היחס בין התלמוד למשנה, לפי המפגש?",o:["התלמוד רשאי לחלוק על המשנה, כי חכמיו באו אחריה","התלמוד מוסיף משניות חדשות לששת הסדרים של המשנה","התלמוד מפרש את המשנה, ואסור לו לחלוק עליה","התלמוד מחליף את המשנה בכל מקום שיש בו מחלוקת"],c:2,e:"מפגש 17.11, דקה 35: «התלמוד הוא מפרש את המשנה. התלמוד אסור לו לחלוק על המשנה, כמו שלמשנה אסור לחלוק על דברי התורה»; הוא מצטט משנה ואחר כך מביא את דעות החכמים. המשנה חתומה ואין מוסיפים עליה (דקה 27), ולכן התלמוד אינו מוסיף לה משניות."},
{l:1,t:"תנאים, אמוראים והתלמוד",s:"מפגש זום",q:"היכן נוצר התלמוד הירושלמי, ומתי נחתם, לפי המפגש?",o:["בגליל – בטבריה ובקיסריה; נחתם בשנת 370","בירושלים, ליד מקום המקדש; נחתם בשנת 370","בגליל – בטבריה ובקיסריה; נחתם בשנת 500","בירושלים, ליד מקום המקדש; נחתם בשנת 500"],c:0,e:"מפגש 17.11, דקה 27: את הירושלמי יצרו חכמי ארץ ישראל, «לא בירושלים – ירושלים חרבה ב־70»; הוא נכתב בגליל, בטבריה ובקיסריה, ונחתם ב־370. 500 היא שנת חתימת התלמוד הבבלי, ושם התלמוד אינו מעיד על מקום חיבורו."},
{l:1,t:"תנאים, אמוראים והתלמוד",s:"מפגש זום",q:"לפי המפגש, מה מעמדו של התלמוד הירושלמי בפסיקת ההלכה כיום?",o:["ההלכה נפסקת ממנו, כי נחתם לפני הבבלי וקרוב יותר למשנה","לומדים אותו כזווית נוספת, אך ההלכה נפסקת מן הבבלי","ההלכה נפסקת ממנו בארץ ישראל, ומן הבבלי בגולה","אין לומדים אותו, כי חכמיו לא ישבו בירושלים"],c:1,e:"מפגש 17.11, דקות 36–37: «כל ההלכה שלנו לפי התלמוד הבבלי»; הירושלמי «יכול לתת לנו זווית אחרת», ולומדים אותו, «אבל לא מורים ממנו הלכה». העובדה שנחתם קודם (370) לא הפכה אותו למקור הפסיקה, ואין חלוקה בין ארץ ישראל לגולה."},
{l:1,t:"תנאים, אמוראים והתלמוד",s:"מפגש זום",q:"מה נכון לגבי התלמוד, לפי המפגש?",o:["נכתב בארמית, ויש בו הלכה ולא סיפורים או היסטוריה","נכתב בעברית, ויש בו הלכה ולא סיפורים או היסטוריה","נכתב בארמית, ויש בו גם אגדה – כל מה שאינו הלכה","נכתב בעברית, ויש בו גם אגדה – כל מה שאינו הלכה"],c:2,e:"מפגש 17.11, דקות 36 ו־46: השפה המקורית של התלמוד היא ארמית, «כי זו הייתה שפת החול המדוברת»; והוא מכיל לא רק הלכות אלא גם הווי, היסטוריה ואגדות – «אגדה זה כל מה שאינו הלכה». עברית מפתה כי יש לו היום תרגומים לעברית (שטיינזלץ), אבל אין זו שפתו המקורית."},
{l:1,t:"תנאים, אמוראים והתלמוד",s:"מפגש זום",q:"מהן «ברייתות», ומה מקור שמן, לפי המפגש?",o:["פירושי האמוראים למשנה; מן הארמית «בר» – בן","משניות שנכנסו למשנה; מן העברית «ברית» – הסכם","תקנות חכמים כמו חנוכה; מן העברית «בריאה» – חידוש","משניות שלא נכנסו למשנה; מן הארמית «בר» – חוץ"],c:3,e:"מפגש 17.11, דקה 45: משניות שהגיעו מאוחר ולא נכנסו לששת הסדרים «קוראים להם ברייתות, מהמילה בר – חוץ, משניות חיצוניות»; האמוראים הכניסו אותן לתלמוד. «בר» במובן «בן» הוא משמעות ארמית אחרת, והברייתות אינן פירושי האמוראים אלא משניות חיצוניות שהם ציטטו."},
{l:1,t:"תנאים, אמוראים והתלמוד",s:"מפגש זום",q:"איזה כלל מצטטת המרצה כדי להראות שכתיבת התורה שבעל פה הייתה לכאורה מעשה אסור?",o:["«משה קיבל תורה מסיני ומסרה ליהושע»","«הוו מתונים בדין, והעמידו תלמידים הרבה, ועשו סייג לתורה»","«מעלים בקודש ולא מורידים»","«דברים שנאמרו בעל פה אי אתה רשאי לכותבם»"],c:3,e:"מפגש 17.11, דקה 44: «לכאורה זה מעשה אסור, כי דברים שנאמרו בעל פה אי אתה רשאי לכותבם»; ובכל זאת חכמים לאורך הדורות כתבו לעצמם טיוטות קטנות כדי ללמד ולזכור, ורבי ובית דינו אספו אותן ומיינו לששה סדרים. «ועשו סייג לתורה» הוא מדברי אנשי כנסת הגדולה, ואינו עוסק בכתיבה."},
{l:1,t:"תנאים, אמוראים והתלמוד",s:"מפגש זום",q:"לפי המפגש, מי הכריע במחלוקות בשעת כתיבת המשנה, למשל בקביעה «הלכה כרבי מאיר»?",o:["רבי יהודה הנשיא ובית דינו – סנהדרין של 71 חכמים","אנשי כנסת הגדולה – בית דין של 120 חכמים","רבי יהודה הנשיא, מתוקף מעמדו כנשיא וללא בית דין","הזקנים – 70 החכמים שהנהיגו את העם במדבר"],c:0,e:"מפגש 17.11, דקות 32–33: «הוא ובית דינו, לא הוא לבד... הסנהדרין שישבו איתו, 71 חברים», חכמים שנבחרו בזכות חוכמתם. 120 הוא מספר אנשי כנסת הגדולה, ו־70 – מספר הזקנים שהנהיגו את העם במדבר (דקה 30)."},
{l:1,t:"תנאים, אמוראים והתלמוד",s:"מפגש זום",q:"כיצד הסבירה המרצה את הכלל «אחרי רבים להטות»?",o:["הולכים לפי המנהג של רוב העם","הולכים לפי הכרעתו של הנשיא","הולכים לפי דעת החכם הקדום ביותר","הולכים לפי רוב הסנהדרין"],c:3,e:"מפגש 17.11, דקות 34–35: גם כשאיננו יודעים אם זו ההלכה המקורית, «אם רוב הסנהדרין החליטו... הולכים לפי הרוב, כי כך כתוב בתורה». הרוב הוא של חכמי בית הדין ולא של העם – בעניין נרות חנוכה העם היה חלוק חצי־חצי, וההכרעה נעשתה בבית הדין."},
{l:1,t:"תנאים, אמוראים והתלמוד",s:"מפגש זום",q:"לפי המפגש, מה קרה ל־24,000 תלמידי רבי עקיבא לפי המחקר, ומי היו מחמשת התלמידים החדשים שלימד אחריהם?",o:["נהרגו בחורבן הבית השני; רבי מאיר ורבי שמעון בר יוחאי","נפלו במרד בר כוכבא; רבי מאיר ורבי שמעון בר יוחאי","נפלו במרד בר כוכבא; הלל הזקן ושמאי הזקן","נהרגו בחורבן הבית השני; הלל הזקן ושמאי הזקן"],c:1,e:"מפגש 17.11, דקות 39–40: «מחקרים גילו שזה לאו דווקא מגפה» – התלמידים נפלו כשהצטרפו לקריאת רבי עקיבא למרד בר כוכבא (135). אחר כך לימד חמישה תלמידים חדשים, ובהם רבי מאיר ורבי שמעון בר יוחאי, ובלעדיהם התושב״ע הייתה משתכחת; רבי יהודה הנשיא, שחי כשני דורות אחר כך, ידע על כך – וזה טעם נוסף לכתיבת המשנה. הלל ושמאי הם מן הזוגות, מוקדמים בהרבה."},
/* ציר הזמן והתקופות */
{l:1,t:"ציר הזמן והתקופות",s:"מפגש זום",q:"מה מהבאים אינו צירוף נכון של שנה ואירוע, לפי ציר הזמן שבמצגת המפגש?",o:["1800 לפנה״ס – עקידת יצחק","70 לספירה – חתימת המשנה","1312 לפנה״ס – מתן תורה","164 לפנה״ס – נס חנוכה"],c:1,e:"מצגת המפגש, שקף 7, ומפגש 17.11, דקה 22: בשנת 70 לספירה חרב הבית השני – «מספר שקל לזכור» – והמשנה נחתמה רק בשנת 200, בידי רבי יהודה הנשיא. שאר הצירופים מופיעים בשקף: עקידת יצחק (1800 לפנה״ס), מתן תורה (1312 לפנה״ס) ונס חנוכה (164 לפנה״ס)."},
{l:1,t:"ציר הזמן והתקופות",s:"מפגש זום",q:"לפי המפגש, כמה נפשות ירדו עם יעקב למצרים, ולכמה איש גדלו כעבור כ־210 שנה?",o:["70 נפש; כ־600,000 איש, כולל נשים וטף","12 נפש; כשלושה מיליון איש","70 נפש; כשלושה מיליון איש","120 נפש; כמיליון וחצי איש"],c:2,e:"מפגש 17.11, דקה 18: «יעקב וילדיו ירדו מצריימה, 70 נפש, וכעבור כ־210 שנה... הפכו לשלושה מיליון איש». 600,000 הוא מספר הגברים מגיל 18 ומעלה במעמד הר סיני, לא כולל נשים וטף; עם הנשים והילדים מגיעים לכשלושה מיליון (דקה 41)."},
{l:1,t:"ציר הזמן והתקופות",s:"מפגש זום",q:"לפי המפגש, משה רבנו הוא דור שישי מאברהם. מהי שושלתו?",o:["משה בן קהת בן עמרם בן לוי","משה בן עמרם בן לוי בן יהודה","משה בן עמרם בן קהת בן יהודה","משה בן עמרם בן קהת בן לוי"],c:3,e:"מפגש 17.11, דקות 18–19: «משה רבנו, הבן של עמרם. עמרם הוא הבן של קהת... לוי, הבן של יעקב», ויעקב בן יצחק בן אברהם. קהת הוא סבו של משה ולא אביו, ומשה משבט לוי ולא משבט יהודה."},
{l:1,t:"ציר הזמן והתקופות",s:"מפגש זום",q:"מהו סדר התקופות שאחרי התנאים, לפי ציר הזמן שבמצגת המפגש?",o:["אמוראים, סבוראים, גאונים, ראשונים, אחרונים","סבוראים, אמוראים, גאונים, ראשונים, אחרונים","אמוראים, גאונים, סבוראים, ראשונים, אחרונים","אמוראים, סבוראים, ראשונים, גאונים, אחרונים"],c:0,e:"מצגת המפגש, שקף 7: אחרי התנאים (חתימת המשנה, 200) באים האמוראים (התלמוד, עד 500), הסבוראים (600), הגאונים (600–1050), הראשונים (1050–1500) והאחרונים (1500 ואילך). הסבוראים באים אחרי האמוראים, שחתמו את התלמוד, ולא לפניהם; והגאונים קודמים לראשונים (דקה 39)."},
{l:1,t:"ציר הזמן והתקופות",s:"מפגש זום",q:"מה מהבאים אינו צירוף נכון של דמות או חיבור והתקופה שאליה הם שייכים, לפי ציר הזמן שבמפגש?",o:["ראשי הישיבות בבבל – הגאונים","רש״י והרמב״ם – הראשונים","השולחן ערוך – הגאונים","הרב עובדיה יוסף – האחרונים"],c:2,e:"מצגת המפגש, שקף 7, ומפגש 17.11, דקה 39: השולחן ערוך שייך לתקופת האחרונים (1500 ואילך), יחד עם הרב עובדיה יוסף. הגאונים (600–1050) הם ראשי הישיבות בבבל, ורש״י והרמב״ם – מגדולי הראשונים (1050–1500), אשכנזי וספרדי."},
{l:1,t:"ציר הזמן והתקופות",s:"מפגש זום",q:"בציר הזמן שבמצגת המפגש סומנו בזהב תקופות החכמים שנלמד עליהם בקורס. אילו הן?",o:["הזוגות, התנאים והאמוראים","הנביאים, אנשי כנסת הגדולה והזוגות","התנאים, האמוראים והגאונים","אנשי כנסת הגדולה, הזוגות והתנאים"],c:3,e:"מצגת המפגש, שקף 7: «חכמי מסכת אבות – מאנשי כנסת הגדולה ועד התנאים»: אנשי כנסת הגדולה ושמעון הצדיק, הזוגות, והתנאים – רבן יוחנן בן זכאי, דור יבנה ורבי עקיבא. האמוראים באו אחרי חתימת המשנה, ולכן אין להם מקום במסכת שהיא חלק מן המשנה."},
{l:1,t:"ציר הזמן והתקופות",s:"מפגש זום",q:"מה מהבאים אינו דוגמה שהביאה המרצה לתקנות חכמים שנוספו לתורה שבעל פה במשך כ־1,500 שנה?",o:["חג הפורים וחג החנוכה","צומות החורבן, כמו תשעה באב","גובה הסוכה ומי פטור ממנה","נטילת ידיים וברכת המזון"],c:2,e:"מפגש 17.11, דקה 22: «פורים וחנוכה לא כתובים בתורה» – חכמים תיקנו אותם, וכן את צומות החורבן, נטילת ידיים, ברכות וברכת המזון. דיני הסוכה (מה גובהה, מי פטור) הובאו דווקא כפירוש שנמסר למשה בעל פה בסיני (דקה 21), ולא כתקנה מאוחרת."},
{l:1,t:"ציר הזמן והתקופות",s:"מפגש זום",q:"אילו שלוש ישיבות גדולות בבבל, «שמהן יצאה תורה לישראל», הזכירה המרצה?",o:["סורא, נהרדעא ופומבדיתא","טבריה, קיסריה ונהרדעא","סורא, ציפורי ופומבדיתא","טבריה, יבנה וקיסריה"],c:0,e:"מפגש 17.11, דקה 29: מאז החורבן רוב העם גלה לבבל, ושם «שלוש ישיבות מפוארות... סורא, נהרדעא, פומבדיתא», שמהן יצאה תורה; בתקופת הגאונים עמדו בראשן הגאונים (שקף 7). טבריה וקיסריה הן הערים שבהן, לפי המרצה, נוצר התלמוד הירושלמי (דקה 27)."},
/* יחידה 2 – מבוא למסכת אבות · חלק א: מאפייני מסכת אבות */
{l:2,t:"מאפייני מסכת אבות",s:"שאלות חזרה",q:"במה שונה מסכת אבות מכל שאר מסכתות המשנה?",o:["אינה עוסקת בהלכה כלל, אלא במוסר, בדרך ארץ ובמידות טובות","עוסקת בהלכות הנזיקין שבין אדם לחברו ובסמכויות הדיינים","יש לה פירוש בתלמוד הבבלי וגם מסכת מקבילה בתוספתא","עוסקת בהלכות ספירת העומר ובשבתות שלפני שבועות"],c:0,e:"סיכום, חלק א (וכן שקף 5): להבדיל מכל המסכתות האחרות, אבות אינה עוסקת בענייני הלכה כלל אלא במוסר, בדרך ארץ ובמידות טובות. אף שהיא בסדר נזיקין, אין היא עוסקת בהלכות נזיקין; ולמסכת אין פירוש בתלמודים ואין לה מקבילה בתוספתא."},
{l:2,t:"מאפייני מסכת אבות",s:"סיכום",q:"לצד מסכת אבות מוצגים שלושה מספרים: 63, 9 ו־6. מה מציין כל אחד מהם?",o:["63 חכמים במסכת; 9 פרקים בה; 6 זוגות בפרק א","63 מסכתות במשנה; התשיעית בסדר נזיקין; 6 פרקים","63 פירושים נכתבו עליה; 9 דורות של חכמים; 6 סדרים","63 מסכתות במשנה; 9 פרקים בה; 6 שבתות של קריאה"],c:1,e:"סיכום, חלק א (וכן שקף 5): מסכת אבות היא אחת מ־63 המסכתות שבמשנה, המסכת התשיעית בסדר נזיקין, ויש בה שישה פרקים. המספר 9 מציין את מקומה בסדר ולא מספר פרקים; ובפרק א יש חמישה זוגות, לא שישה."},
{l:2,t:"מאפייני מסכת אבות",s:"סיכום",q:"לפי היחידה, מה בדרך כלל מבטא המאמר המובא בשם חכם במסכת אבות?",o:["את «המוטו» לחייו של החכם, תמצית השקפת עולמו הייחודית","פסק הלכה שקבע החכם בדין שהובא לפניו בבית הדין","פירוש שנתן החכם לפסוק מסוים בתורה שבכתב","תקנה שתיקן החכם כדי לחזק את סמכות החכמים"],c:0,e:"סיכום, חלק א (וכן שקף 6): המסכת בנויה ממאמרים קצרים, ובדרך כלל המאמר הוא «המוטו» לחיים של אותו חכם, תמצית השקפת עולמו הייחודית. אין אלה פסקי הלכה, שהרי המסכת אינה עוסקת בהלכה; והתקנה לחיזוק סמכות החכמים היא קריאת המסכת, לא תוכן מאמריה."},
{l:2,t:"מאפייני מסכת אבות",s:"סיכום",q:"איזה מן המשפטים הבאים אינו נמנה בין הפתגמים הידועים מתוך מסכת אבות שמובאים ביחידה?",o:["סייג לחכמה שתיקה","שמע בני מוסר אביך","אמור מעט ועשה הרבה","אל תסתכל בקנקן, אלא במה שיש בו"],c:1,e:"סיכום, חלק א (וכן שקף 6): בין הפתגמים הידועים מן המסכת מובאים «סייג לחכמה שתיקה», «אמור מעט ועשה הרבה», «אם אין אני לי מי לי», «איזהו גיבור? הכובש את יצרו» ו«אל תסתכל בקנקן». «שמע בני מוסר אביך» הוא מדברי שלמה המלך (משלי א, ח), ומובא בחלק ה להסבר המילה «מוסר»."},
{l:2,t:"מאפייני מסכת אבות",s:"שאלות חזרה",q:"על פי איזה סדר מופיעים החכמים בפרק הראשון של המסכת, ועל פי איזה סדר בפרקים שאחריו?",o:["בפרק א לפי סדר הדורות; בפרקים ב–ו התנאים, בדרך כלל לפי סדר חייהם","בפרק א דברי התנאים לפי הסדר שבו חיו; בפרקים ב–ו לפי נושאי האמרות","בפרק א לפי חשיבות החכמים; בפרקים ב–ו לפי סדר הדורות, מאנשי כנסת הגדולה","בפרק א לפי נושאי האמרות; בפרקים ב–ו לפי סדר הזוגות והנשיאים"],c:0,e:"סיכום, חלק א (טבלת סדר החכמים, וכן שקף 8): פרק א מסודר על פי סדר הדורות, מאנשי כנסת הגדולה דרך הזוגות ועד תחילת הנשיאים; פרקים ב–ו הם דברי התנאים, בדרך כלל לפי הסדר שבו חיו. סדר הדורות שייך לפרק א, והתנאים – לפרקים שאחריו."},
{l:2,t:"מאפייני מסכת אבות",s:"סיכום",q:"מהו הסדר הנכון של קבוצות החכמים בפרק א של מסכת אבות?",o:["הזוגות, אחריהם אנשי כנסת הגדולה, ואחריהם הנשיאים","אנשי כנסת הגדולה, אחריהם הנשיאים, ואחריהם הזוגות","אנשי כנסת הגדולה, אחריהם הזוגות, ואחריהם הנשיאים","הנשיאים, אחריהם הזוגות, ואחריהם אנשי כנסת הגדולה"],c:2,e:"סיכום, חלק א (וכן שקף 8): פרק א מסודר לפי סדר הדורות – מאנשי כנסת הגדולה (תקופת בית שני), דרך תקופת הזוגות, ועד תחילת הנשיאים, שאת מוסדם ייסד הלל הזקן. הנשיאים חותמים את הרצף ואינם באים לפני הזוגות."},
{l:2,t:"מאפייני מסכת אבות",s:"סיכום",q:"מי ייסד את מוסד הנשיאות, שבתחילתו מסתיים פרק א של המסכת?",o:["אנשי כנסת הגדולה","רבי נתן","הלל הזקן","הזקנים שקיבלו מיהושע"],c:2,e:"סיכום, חלק א (וכן שקף 8): פרק א מגיע «עד תחילת הנשיאים», ו«הלל הזקן ייסד את מוסד הנשיאות». אנשי כנסת הגדולה פותחים את פרק א ואינם מייסדי הנשיאות; ורבי נתן נזכר ביחידה רק בשם החיבור «אבות דרבי נתן»."},
{l:2,t:"מאפייני מסכת אבות",s:"סיכום",q:"מה הם «הזוגות» שבפרק א, לפי היחידה?",o:["חמישה זוגות של חכמים, שבאו אחרי אנשי כנסת הגדולה","שישה זוגות של תנאים, שדבריהם מובאים בפרקים ב–ו של המסכת","חמישה זוגות של נביאים, שמסרו את התורה לזקנים","זוגות של פתגמים מקבילים, אחד בהלכה ואחד במוסר"],c:0,e:"סיכום, חלק א ומושגי המפתח (וכן שקף 8): תקופת הזוגות היא «חמישה זוגות של חכמים», והיא באה בפרק א בין אנשי כנסת הגדולה לבין הנשיאים. דברי התנאים מובאים בפרקים ב–ו ואינם הזוגות; והמסכת אינה עוסקת בהלכה, כך שאין בה פתגמי הלכה."},
{l:2,t:"מאפייני מסכת אבות",s:"סיכום",q:"לאיזו תקופה משייכת היחידה את אנשי כנסת הגדולה, הפותחים את סדר החכמים בפרק א?",o:["תקופת מתן תורה בסיני","תקופת בית שני","תקופת התנאים שאחרי הלל","תקופת יהושע והזקנים"],c:1,e:"סיכום, חלק א ומושגי המפתח (וכן שקף 8): אנשי כנסת הגדולה – «תקופת בית שני»; הם החוליה שקיבלה את התורה מן הנביאים. מתן תורה, יהושע והזקנים הם חוליות קודמות בשרשרת המסירה (אבות א, א), והתנאים באים בפרקים ב–ו."},
{l:2,t:"מאפייני מסכת אבות",s:"סיכום",q:"מהו החיבור «אבות דרבי נתן»?",o:["חיבור המושתת בעיקרו על מסכת אבות ומהווה הרחבה שלה","הפירוש למסכת אבות שבתלמוד הבבלי ובתלמוד הירושלמי","המסכת המקבילה למסכת אבות בתוספתא, בת שישה פרקים","ספר הפירוש של הרב ישראל מאיר לאו על פרקי אבות"],c:0,e:"סיכום, חלק א (וכן שקף 8): למסכת אבות לא חובר פירוש בתלמוד הבבלי או בירושלמי, ואין לה מסכת מקבילה בתוספתא; אבל «אבות דרבי נתן» מושתת בעיקרו עליה ומהווה הרחבה שלה. ספרו של הרב לאו נקרא «יחל ישראל»."},
{l:2,t:"מאפייני מסכת אבות",s:"סיכום",q:"מה מהבאים אינו נכון לגבי מסכת אבות, לפי היחידה?",o:["היא בנויה ממאמרים קצרים של חכמי המשנה","מאות פירושים נכתבו עליה בכל תפוצות ישראל","יש לה מסכת מקבילה בתוספתא","היא מכונה גם «פרקי אבות»"],c:2,e:"סיכום, חלק א: «אין לה מסכת מקבילה בתוספתא», וגם לא חובר לה פירוש בתלמודים; ההרחבה שלה היא «אבות דרבי נתן». שאר הטענות מופיעות בסיכום: היא מכונה «פרקי אבות», בנויה ממאמרים קצרים של חכמי המשנה, ומאות פירושים נכתבו עליה בכל התפוצות."},
{l:2,t:"מאפייני מסכת אבות",s:"סיכום",q:"מה מהבאים אינו מתואר ביחידה כתרומה של מסכת אבות לקוראיה כיום?",o:["הצצה נדירה להשקפת העולם הערכית של חז״ל","בסיס לדיון ערכי, עכשווי ואקטואלי","הכרעה הלכתית בסכסוכים שבין אדם לחברו","קשר בין הקוראים היום למקורות ספרות חז״ל"],c:2,e:"סיכום, חלק א (וכן שקף 7): המסכת חורגת מן העיסוק בהלכה, ולכן מאפשרת הצצה נדירה להשקפת העולם הערכית של חז״ל, בסיס לדיון ערכי ועכשווי וקשר למקורות. הכרעה הלכתית אינה מתאימה, שהרי המסכת אינה עוסקת בהלכה כלל; סכסוכים נזכרים בטעם הרמב״ם, ושם כדרך מוסרית ולא כהלכה."},
/* חלק ב: מיקומה בסדר נזיקין */
{l:2,t:"מיקומה בסדר נזיקין",s:"סיכום",q:"מי נתן שני טעמים לשאלה מדוע מוקמה מסכת אבות דווקא בסדר נזיקין, והיכן?",o:["הרמב״ם, בהקדמתו לפירוש המשנה","הרב ישראל מאיר לאו, בספרו «יחל ישראל»","רש״י, בפירושו לשם המסכת «אבות»","«אבות דרבי נתן», בהרחבתו למסכת"],c:0,e:"סיכום, חלק ב (וכן שקף 9): «הרמב״ם, בהקדמתו לפירוש המשנה, נותן שני טעמים» למיקום המסכת בסדר נזיקין. רש״י נזכר ביחידה בהקשר שם המסכת, והרב לאו – בהקשר ההבדל בין מסירה לנתינה."},
{l:2,t:"מיקומה בסדר נזיקין",s:"שאלות חזרה",q:"מהם שני הטעמים שנותן הרמב״ם למיקומה של מסכת אבות בסדר נזיקין?",o:["«דרך ארץ קדמה לתורה»; הקשר בין התורה שבכתב לתורה שבעל־פה","המסירה היא פיקדון; המוסרות שומרות על החיבור לעבר העם","אבות הם החכמים שהגו את האמרות; אבות הם עקרונות היסוד","כבוד בית הדין ומקור סמכותו; ללמד את הדיינים מידות טובות"],c:3,e:"סיכום, חלק ב (וכן שקף 9): הטעם הראשון – כבוד בית הדין שבכל דור ומקור סמכותו בשושלת עד סיני; השני – «ללמד את הדיינים מידות טובות לבל יזיקו את הציבור». «דרך ארץ קדמה לתורה» והקשר בין שבכתב לשבעל־פה הן הסיבות לקריאה בין פסח לשבועות, לא למיקום בסדר."},
{l:2,t:"מיקומה בסדר נזיקין",s:"סיכום",q:"איזה מאפיין של מסכת אבות משמש בסיס לטעם הראשון של הרמב״ם, כבוד בית הדין?",o:["העובדה שאינה עוסקת בהלכה, אלא במוסר ובמידות טובות","הקריאה בה בשש השבתות שבין פסח לשבועות, סמוך למנחה","הפתגמים הקצרים בה, שהם «המוטו» לחייו של כל חכם","שושלת חכמי הדורות המופיעה בה, עד קבלת התורה בסיני"],c:3,e:"סיכום, חלק ב: «במסכת אבות מופיעה שושלת חכמי הדורות עד קבלת התורה בידי משה בסיני», ומכאן יודעים שכוחו של בית הדין הועבר בשושלת עד מתן תורה. העיסוק במוסר ובמידות קשור דווקא לטעם השני – לימוד מידות טובות לדיינים."},
{l:2,t:"מיקומה בסדר נזיקין",s:"סיכום",q:"אדם שואל: «מדוע עליי לקבל את תקנתו של דיין פלוני? מי הסמיך אותו?» מה התשובה ברוח הטעם הראשון של הרמב״ם?",o:["הדיין פועל מכוח דעתו האישית, שהציבור בחר לקבל עליו","אין חובה לציית לו, שהרי מסכת אבות אינה עוסקת בהלכה","הדיין קיבל את סמכותו מן הנשיאות שייסד הלל, ולא מסיני","הדיין פועל מכוח התורה והמסורת, שמקור סמכותן בקב״ה"],c:3,e:"סיכום, חלק ב: «ההלכה אינה שייכת לחכמים. החכם אינו פועל מכוח דעתו האישית, אלא מכוח סמכותה של התורה והמסורת ההלכתית. מקור הסמכות הוא הקב״ה». לכן המסכת מביאה את השושלת עד סיני. העובדה שהמסכת עצמה אינה הלכתית אינה מבטלת את סמכות בית הדין."},
{l:2,t:"מיקומה בסדר נזיקין",s:"סיכום",q:"בדברי הרמב״ם מובא הפסוק «כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא». מה הוא בא להראות?",o:["שהדיינים צריכים מידות טובות כדי שלא יזיקו לציבור","שהמשפט אינו שייך לשופט עצמו, אלא לקב״ה שציווה עליו","שיש לספור את העומר למחרת יום טוב הראשון של פסח","שהתורה נמסרה כפיקדון, כדי שנמסור אותה לדור הבא"],c:1,e:"סיכום, חלק ב (ציטוט הרמב״ם, וכן שקף 9): «המשפט אינו לפלוני השופט, אלא להקב״ה שציווה אותנו בו», ולכן יש לקבל את פסקי בית הדין. זהו הטעם הראשון; לימוד מידות טובות לדיינים הוא הטעם השני, ואינו מה שהפסוק בא להוכיח."},
{l:2,t:"מיקומה בסדר נזיקין",s:"סיכום",q:"השלימו את לשון הטעם השני של הרמב״ם: «ללמד את הדיינים מידות טובות…»",o:["כדי שיכבדו את בית הדין","לבל יבטלו את המסורת","לבל יזיקו את הציבור","כדי שיקבלו תורה בשבועות"],c:2,e:"סיכום, חלק ב (וכן שקף 9): «ללמד את הדיינים מידות טובות לבל יזיקו את הציבור». ההשלמה מתאימה לסדר נזיקין, העוסק בנזקים ובסכסוכים בין בני אדם. כבוד בית הדין הוא עניינו של הטעם הראשון, וקבלת התורה בשבועות – של מנהג הקריאה."},
{l:2,t:"מיקומה בסדר נזיקין",s:"סיכום",q:"לפי הסיכום, אחרי אילו מסכתות באה מסכת אבות בתוך סדר נזיקין?",o:["אחרי המסכתות העוסקות בהלכות ספירת העומר והמועדים","אחרי המסכתות על סמכויות הדיינים ומהלך המשפט","אחרי המסכתות המפרשות את התורה שבכתב מול הצדוקים","אחרי המסכתות העוסקות בשושלת הנשיאים ובתקנותיהם"],c:1,e:"סיכום, חלק ב (וכן שקף 9): «מסכת אבות באה בתוך סדר נזיקין, אחרי המסכתות המפרטות את סמכויות הדיינים ואת מהלך המשפט», וכך היא משלימה אותן בלימוד מידות לדיינים. ספירת העומר אינה קשורה למיקום המסכת, אלא למנהג הקריאה בה."},
{l:2,t:"מיקומה בסדר נזיקין",s:"סיכום",q:"מה מהבאים אינו קשור לטעמי הרמב״ם למיקומה של המסכת בסדר נזיקין?",o:["כבוד בית הדין שבכל דור ודור","מקור סמכות הדיינים בקב״ה ובמסורת","לימוד מידות טובות לדיינים","ההכנה לחג מתן תורה"],c:3,e:"סיכום, חלקים ב–ג: טעמי הרמב״ם הם כבוד בית הדין ומקור סמכותו (התורה והמסורת שמקורן בקב״ה) ולימוד מידות טובות לדיינים. ההכנה לקבלת התורה בשבועות היא סיבה למנהג לקרוא את המסכת בשבתות ספירת העומר (חלק ג), לא טעם למיקומה."},
/* חלק ג: הקריאה בין פסח לשבועות */
{l:2,t:"הקריאה בין פסח לשבועות",s:"סיכום",q:"מתי ובאיזה אופן נוהגים לקרוא את מסכת אבות?",o:["בשש שבתות ספירת העומר, סמוך לתפילת מנחה, פרק בכל שבת","בשבעת ימי חג הפסח, אחרי תפילת שחרית, פרק בכל יום","בשש השבתות שאחרי שבועות, לפני קריאת התורה","בליל חג השבועות, ברצף אחד, כהכנה לקבלת התורה"],c:0,e:"סיכום, חלק ג (וכן שקף 10): נוהגים לקרוא את המסכת בבית הכנסת, סמוך לתפילת מנחה, «בשש השבתות של ספירת העומר – בין חג הפסח לחג השבועות – פרק אחד בכל שבת». הקריאה קודמת לשבועות ואינה באה אחריו, שהרי היא הכנה לחג מתן תורה."},
{l:2,t:"הקריאה בין פסח לשבועות",s:"סיכום",q:"קהילה מתחילה לקרוא את מסכת אבות בשבת הראשונה של ספירת העומר, פרק אחד בכל שבת, לפי המנהג. מתי תסיים את המסכת?",o:["בשבת התשיעית, כמספר מקומה של המסכת בסדר נזיקין","בשבת החמישית, כמספר הזוגות המופיעים בפרק א","בשבת השישית, לפני שבועות, כי במסכת שישה פרקים","בחג השבועות עצמו, ביום קבלת התורה"],c:2,e:"סיכום, חלקים א ו־ג: במסכת שישה פרקים, וקוראים אותה בשש השבתות של ספירת העומר, פרק אחד בכל שבת – ולכן הקריאה מסתיימת בשבת השישית, לפני שבועות. 9 הוא מקומה בסדר נזיקין, ו־5 הוא מספר הזוגות, ואין להם קשר למספר השבתות."},
{l:2,t:"הקריאה בין פסח לשבועות",s:"סיכום",q:"לפי הסיבה הראשונה למנהג, מדוע לומדים את מסכת אבות דווקא לפני חג השבועות?",o:["כי לפני קבלת התורה יש ללמוד דרך ארץ, מידות ומוסר","כי המסכת מוכיחה שהתורה שבעל־פה קדמה לתורה שבכתב","כי המסכת מלמדת את הדיינים לכבד את בית הדין לפני החג","כי המסכת מפרטת את הלכות ספירת העומר והקרבת העומר"],c:0,e:"סיכום, חלק ג (וכן שקף 11): לפי הסיבה הראשונה, «דרך ארץ קדמה לתורה» – כדי לקבל תורה בשבועות צריך להקדים וללמוד דרך ארץ, מידות ומוסר, שבהם עוסקת המסכת. הקשר בין שבכתב לשבעל־פה הוא הסיבה השנייה, והיא אינה טוענת שאחת מהן קדמה לשנייה."},
{l:2,t:"הקריאה בין פסח לשבועות",s:"סיכום",q:"מהי «דרך ארץ», לפי הגדרת הסיכום?",o:["סדר הדורות של מסירת התורה מסיני ועד הנשיאים","פסקי ההלכה שבהם מכריעים הדיינים בסכסוכים","התורה שבעל־פה, שהצדוקים והקראים לא האמינו בה","הנימוסים וההליכות המקובלים בחברה שבה האדם חי"],c:3,e:"סיכום, חלק ג ומושגי המפתח: «דרך ארץ» היא «נימוסים והליכות מקובלות בחברה», ומי שאינו נוהג בה – לא ניתן ללמדו תורה ומצוות. שושלת המסירה קשורה לטעם הרמב״ם, והתורה שבעל־פה – לסיבה השנייה לקריאה, ואין אלה הגדרת דרך ארץ."},
{l:2,t:"הקריאה בין פסח לשבועות",s:"סיכום",q:"כיצד פירשו חכמי ישראל את המילים «ממחרת השבת» בפסוק «וּסְפַרְתֶּם לָכֶם מִמָּחֳרַת הַשַּׁבָּת»?",o:["למחרת שבת של יום השבוע, ולכן סופרים מיום ראשון","למחרת יום טוב הראשון של פסח, שגם הוא נקרא «שבת»","למחרת השבת האחרונה שלפני חג הפסח","למחרת חג השבועות, שבו ניתנה התורה בסיני"],c:1,e:"סיכום, חלק ג (טבלה, וכן שקף 12): לפי חכמי ישראל «ממחרת השבת» הוא «למחרת יום טוב הראשון של פסח – שכן יום טוב של פסח נקרא ׳שבת׳». הפירוש שלפיו מדובר בשבת של יום השבוע, ולכן מתחילים לספור ביום ראשון, הוא שיטת הצדוקים והקראים."},
{l:2,t:"הקריאה בין פסח לשבועות",s:"שאלות חזרה",q:"מה הקשר בין המחלוקת על «ממחרת השבת» לבין קריאת מסכת אבות בין פסח לשבועות?",o:["זו תקנת חכמים שמראה את סמכותם, כדי שהעם יישאר נאמן למסורת","הקריאה נועדה ללמד את הצדוקים והקראים דרך ארץ לפני קבלת התורה","המסכת עצמה מכריעה במחלוקת ופוסקת מתי מתחילים לספור את העומר","הקריאה מתחילה ביום ראשון בשבוע, כדי לגשר בין שתי השיטות"],c:0,e:"סיכום, חלק ג (וכן שקף 12): בגלל המחלוקת עם הצדוקים והקראים, שלא האמינו בתורה שבעל־פה, קבעו חכמים תקנות שיראו את כובד סמכותם; אחת מהן היא קריאת המסכת – כולה דברי חכמים שקיבלו במסורת בעל־פה – בין פסח לשבועות. המסכת עצמה אינה מכריעה בהלכה."},
{l:2,t:"הקריאה בין פסח לשבועות",s:"סיכום",q:"מה מהבאים אינו נכון לגבי הצדוקים והקראים, לפי היחידה?",o:["הם לא האמינו בתורה שבעל־פה","הם מתחילים לספור את העומר ביום ראשון בשבוע","לדעתם, «שבת» בפסוק היא יום טוב הראשון של פסח","לדעתם, «ממחרת השבת» הוא היום שאחרי שבת של יום השבוע"],c:2,e:"סיכום, חלק ג (טבלה): הצדוקים והקראים, שלא האמינו בתורה שבעל־פה, פירשו «ממחרת השבת» כלמחרת השבת של יום השבוע, ולכן מתחילים לספור ביום ראשון. הפירוש ש«שבת» היא יום טוב הראשון של פסח הוא פירוש חכמי ישראל, לא שלהם."},
{l:2,t:"הקריאה בין פסח לשבועות",s:"שאלות חזרה",q:"מהן שתי הסיבות העיקריות למנהג לקרוא את פרקי אבות בין פסח לשבועות?",o:["כבוד בית הדין; לימוד מידות טובות לדיינים","«דרך ארץ קדמה לתורה»; הקשר בין התורה שבכתב לשבעל־פה","לימוד הלכות ספירת העומר; הכנה לדיני הנזיקין שבסדר","מסירת התורה מדור לדור; הצגת פתגמי החכמים הידועים"],c:1,e:"סיכום, חלק ג (וכן שקפים 11 ו־19): הסיבה הראשונה – «דרך ארץ קדמה לתורה», הכנה לקבלת התורה בשבועות; השנייה – הדגשת הקשר בין התורה שבכתב לתורה שבעל־פה וחיזוק סמכות החכמים. כבוד בית הדין ומידות לדיינים הם טעמי הרמב״ם למיקום המסכת בסדר נזיקין."},
/* חלק ד: שם המסכת */
{l:2,t:"שם המסכת",s:"שאלות חזרה",q:"מהן שתי הסברות לשם המסכת «אבות»?",o:["כינוי לנשיאים שייסד הלל; רמז לשושלת הדיינים בבית הדין","כינוי לחכמים שהגו את האמרות; רמז לרעיונות, עקרונות היסוד שבה","כינוי למפרשי המסכת בתפוצות; רמז לפסקי ההלכה של חז״ל","כינוי לאנשי כנסת הגדולה; רמז לשש שבתות ספירת העומר"],c:1,e:"סיכום, חלק ד (וכן שקף 13): לפי הסברה הראשונה «אבות» הוא כינוי לחכמים שהגו את האמרות («אבות עולם», «אבות ראשונים»); לפי השנייה הוא רומז לרעיונות – עקרונות יסוד להתנהגות האדם, שעליהם מבוססים פסקי ההלכה. אין סברה שמייחסת את השם לנשיאים או למפרשים."},
{l:2,t:"שם המסכת",s:"סיכום",q:"רש״י כותב על שם המסכת: «מפני שנסדרו הנה דברי אבות הראשונים שקיבלו את התורה זה מזה». מי הם ה«אבות» לפי פירושו?",o:["הרעיונות ועקרונות היסוד שבמסכת","הנביאים שמסרו לאנשי כנסת הגדולה","הדיינים שבבית הדין בכל דור","החכמים שהגו את האמרות שבמסכת"],c:3,e:"סיכום, חלק ד (וכן שקף 13): דברי רש״י מובאים לסברה הראשונה – «אבות» הם החכמים שהגו את האמרות ושקיבלו את התורה זה מזה. הסברה שלפיה «אבות» הם הרעיונות ועקרונות היסוד היא הסברה השנייה, ורש״י אינו מובא לחיזוקה."},
{l:2,t:"שם המסכת",s:"סיכום",q:"לפי הסברה הראשונה לשם המסכת, באילו כינויים נקראים החכמים בכמה מקומות במשנה ובתלמוד?",o:["«אבות הדיינים» ו«אבות המשפט»","«אבות המסורת» ו«אבות המוסר»","«אבות עולם» ו«אבות ראשונים»","«אבות הזוגות» ו«אבות הנשיאים»"],c:2,e:"סיכום, חלק ד (טבלת הסברות, וכן שקף 13): «בכמה מקומות במשנה ובתלמוד הם נקראים ׳אבות עולם׳ או ׳אבות ראשונים׳», ומכאן הסברה ש«אבות» הוא כינוי לחכמים. הצירופים האחרים בנויים ממושגי היחידה (דיינים, מסורת, מוסר, זוגות) אך אינם מופיעים בה ככינויים."},
{l:2,t:"שם המסכת",s:"סיכום",q:"מסכת אבות אינה עוסקת בהלכה, ובכל זאת הסברה השנייה לשמה קושרת אותה להלכה. כיצד?",o:["החכמים שבה נקראים «אבות עולם», כי פסקו את ההלכות שבמשנה","היא מסכמת את ההלכות של שאר המסכתות שבסדר נזיקין","הרעיונות שבה הם עקרונות יסוד שעליהם מבוססים פסקי ההלכה","היא קובעת את הלכות ספירת העומר לפי שיטת חכמי ישראל"],c:2,e:"סיכום, חלק ד (וכן שקף 13): לפי הסברה השנייה «אבות» רומז לרעיונות – «עקרונות יסוד להתנהגות האדם בכל התחומים, שעליהם מבוססים פסקי ההלכה של חז״ל». הכינוי «אבות עולם» שייך לסברה הראשונה, והיחידה אינה מנמקת אותו בפסיקת הלכות."},
{l:2,t:"שם המסכת",s:"סיכום",q:"מה מהבאים אינו נכון לגבי שם המסכת, לפי היחידה?",o:["לפי סברה אחת, «אבות» הוא כינוי לחכמים שהגו את האמרות","רש״י מפרש את השם ברוח הסברה שהאבות הם החכמים","לפי סברה אחת, «אבות» רומז לרעיונות ולא לאישים","לפי סברה אחת, «אבות» הם הדיינים שיש לכבדם בכל דור"],c:3,e:"סיכום, חלק ד: שתי הסברות לשם הן החכמים שהגו את האמרות (ורש״י ברוחה) או הרעיונות ועקרונות היסוד. כבוד הדיינים בכל דור ודור הוא עניינו של הטעם הראשון של הרמב״ם למיקום המסכת בסדר נזיקין (חלק ב), ולא הסבר לשם."},
/* חלק ה: מסירה ונתינה (כולל ברל כצנלסון, שקף 18) */
{l:2,t:"מסירה ונתינה",s:"סיכום",q:"לפי אבות א, א, מהו סדר שרשרת המסירה של התורה?",o:["משה, זקנים, יהושע, נביאים, אנשי כנסת הגדולה","משה, יהושע, נביאים, זקנים, אנשי כנסת הגדולה","משה, יהושע, זקנים, אנשי כנסת הגדולה, נביאים","משה, יהושע, זקנים, נביאים, אנשי כנסת הגדולה"],c:3,e:"סיכום, חלק ה (וכן שקף 14): «משה קיבל תורה מסיני, ומסרה ליהושע, ויהושע לזקנים, וזקנים לנביאים, ונביאים מסרוה לאנשי כנסת הגדולה». הזקנים באים אחרי יהושע ולפני הנביאים, ואנשי כנסת הגדולה הם החוליה האחרונה במשנה זו."},
{l:2,t:"מסירה ונתינה",s:"סיכום",q:"מהם «שלושה דברים» שאמרו אנשי כנסת הגדולה, לפי אבות א, א?",o:["הוו מתונים בדין, אמור מעט ועשה הרבה, עשו סייג לתורה","הוו מתונים בדין, העמידו תלמידים הרבה, עשו סייג לתורה","סייג לחכמה שתיקה, העמידו תלמידים הרבה, עשו סייג לתורה","הוו מתונים בדין, העמידו תלמידים הרבה, אל תסתכל בקנקן"],c:1,e:"סיכום, חלק ה (וכן שקף 14): אנשי כנסת הגדולה «אמרו שלושה דברים: הוו מתונים בדין, והעמידו תלמידים הרבה, ועשו סייג לתורה». «אמור מעט ועשה הרבה», «סייג לחכמה שתיקה» ו«אל תסתכל בקנקן» הם פתגמים אחרים מן המסכת, שאינם חלק ממשנה זו."},
{l:2,t:"מסירה ונתינה",s:"שאלות חזרה",q:"מה ההבדל בין «מסירה» ל«נתינה» לפי הרב ישראל מאיר לאו, ואיזו אחריות נובעת מכך?",o:["נתינה היא פיקדון ומסירה היא מתנה; לכן התורה שייכת לכל לומד כרכושו","נתינה היא מתנה ומסירה היא פיקדון; לכן עלינו לשמרה ולמסור אותה הלאה","נתינה ומסירה הן מילים נרדפות; לכן הדגש הוא על לימוד התורה ולא על הנחלתה","נתינה היא מתנה ומסירה היא פיקדון; לכן כל דור רשאי להחליט אם להעבירה"],c:1,e:"סיכום, חלק ה (וכן שקפים 15 ו־17): «הנתינה היא מתנה, המסירה היא פיקדון»; התורה נמסרה לנו כפיקדון כדי שנמסור אותה הלאה, לבנינו ולתלמידינו, ופיקדון מחייב אחריות. מסיח אחד מחליף בין המושגים, ואחר שומר על ההגדרה אך מחמיץ את חובת ההנחלה."},
{l:2,t:"מסירה ונתינה",s:"סיכום",q:"באיזה חיבור מבהיר הרב ישראל מאיר לאו מדוע נכתב במסכת לשון מסירה ולא לשון נתינה?",o:["במאמר «מקורות לא אכזב», בעיתון «דבר»","בהקדמתו לפירוש המשנה","בחיבור «אבות דרבי נתן»","בספרו «יחל ישראל»"],c:3,e:"סיכום, חלק ה (וכן שקף 15): הרב לאו מבהיר זאת «בספרו ׳יחל ישראל׳ על פרקי אבות». «מקורות לא אכזב» הוא מאמרו של ברל כצנלסון בעיתון «דבר» (שקף 18), וההקדמה לפירוש המשנה היא של הרמב״ם."},
{l:2,t:"מסירה ונתינה",s:"סיכום",q:"מה הקשר בין המילה «מסורת» לבין מסירת התורה, לפי היחידה?",o:["המסירה נתקלת בקשיים, כי לאדם ניתנה זכות הבחירה","המסירה קשורה לעבר העם כמו רצועות הקושרות בהמה לעגלה","המסירה יכולה לעבור מדור לדור כאשר יש שמירה על המסורת","המסירה היא מתנה, ולכן כל אחד מקבל אותה בלי מחויבות"],c:2,e:"סיכום, חלק ה (טבלת השורש מ־ס־ר, וכן שקף 16): «מסורת» היא מאותו השורש של «מסירה», ו«המסירה יכולה לעבור מדור לדור כאשר יש שמירה על המסורת». הקשיים והבחירה שייכים למילה «מוסר», והרצועות – למילה «מוסרות»."},
{l:2,t:"מסירה ונתינה",s:"סיכום",q:"מה הן «מוסרות», ומה הן מלמדות על המסירה, לפי היחידה?",o:["רצועות הקושרות בהמה לעגלה; המסירה מחוברת לעבר העם","דברי תוכחה של אב לבנו; המסירה כרוכה לעיתים בייסורים","שרשרת דיינים בבית הדין; המסירה מעניקה סמכות לחכמים","ספרי פירוש למסכת; המסירה מתרחבת בכל תפוצות ישראל"],c:0,e:"סיכום, חלק ה (וכן שקף 16): «מוסרות» הן «הרצועות הקושרות את הבהמה לעגלה», ששומרות על החיבור לבל יינתק – כך המסירה מחוברת לעברו של העם, והלימוד הוא גם כדי לשמור ולעשות. תוכחה וייסורים מתאימים למילה «מוסר», לא למוסרות."},
{l:2,t:"מסירה ונתינה",s:"סיכום",q:"היחידה מביאה את הפסוק «שמע בני מוסר אביך» (משלי א, ח). מה היא לומדת מן המילה «מוסר» על המסירה?",o:["שהמסירה קשורה ומחוברת לעברו של העם, כמו רצועות לעגלה","שהמסירה היא פיקדון שנמסר לבנים, ולכן אין בה קושי או התלבטות","שהמסירה עוברת מדור לדור כאשר שומרים על המסורת","שהמסירה נתקלת לעיתים בייסורים ובלבטים, בשל זכות הבחירה"],c:3,e:"סיכום, חלק ה (וכן שקף 16): מן «מוסר» – כדברי שלמה המלך – לומדים ש«המסירה נתקלת לעיתים בייסורים, בקשיים ובלבטים – שהרי לאדם ניתנה זכות הבחירה». החיבור לעבר כמו רצועות לעגלה הוא משמעות «מוסרות», והשמירה מדור לדור – «מסורת»."},
{l:2,t:"מסירה ונתינה",s:"סיכום",q:"איזו מן המילים הבאות אינה אחת משלוש המילים מן השורש מ־ס־ר שהיחידה מסבירה?",o:["מסורת","מוסרות","מסירות","מוסר"],c:2,e:"סיכום, חלק ה (טבלת «שלוש מילים מאותו השורש», וכן שקף 16): שלוש המילים הן מסורת (השמירה המאפשרת מעבר מדור לדור), מוסרות (הרצועות הקושרות בהמה לעגלה) ומוסר («שמע בני מוסר אביך»). «מסירות» אינה מוסברת ביחידה, אף שהיא נשמעת קרובה."},
{l:2,t:"מסירה ונתינה",s:"מצגת",q:"מי היה ברל כצנלסון, שדבריו «דור מחדש ויוצר…» מובאים בחלק על מסירה ונתינה?",o:["ממנהיגי תנועת העבודה בארץ ישראל והוגה של הציונות הסוציאליסטית","מפרש המשנה שכתב הקדמה ובה טעמי מיקומה של המסכת","הרב הראשי לישראל ויו״ר מועצת יד ושם, מחבר «יחל ישראל»","החכם שחיבר את «אבות דרבי נתן» כהרחבה של המסכת"],c:0,e:"שקף 18: ברל כצנלסון (נפטר תש״ד, 1944) היה «ממנהיגי תנועת העבודה בארץ ישראל, הוגה דעות של הציונות הסוציאליסטית, עיתונאי, עורך וממקימי מוסדות ההסתדרות». הרב הראשי ויו״ר מועצת יד ושם הוא הרב ישראל מאיר לאו (שקף 15)."},
{l:2,t:"מסירה ונתינה",s:"מצגת",q:"איזו מן ההתאמות הבאות בין ציטוט לבין אומרו אינה נכונה?",o:["«הנתינה היא מתנה, המסירה היא פיקדון» – הרב ישראל מאיר לאו","«ללמד את הדיינים מידות טובות לבל יזיקו את הציבור» – הרמב״ם","«מפני שנסדרו הנה דברי אבות הראשונים» – רש״י","«דור מחדש ויוצר איננו זורק אל גל האשפה» – הרב לאו"],c:3,e:"שקפים 9, 13, 15 ו־18 (וכן הסיכום, חלקים ב, ד, ה): הרב לאו אמר «הנתינה היא מתנה, המסירה היא פיקדון»; הרמב״ם – «ללמד את הדיינים…»; רש״י – «מפני שנסדרו…». «דור מחדש ויוצר» הם דברי ברל כצנלסון במאמרו «מקורות לא אכזב», ולא של הרב לאו."},
{l:2,t:"מסירה ונתינה",s:"סיכום",q:"לפי הסיכום, מדוע «אחריות היא מילת מפתח להצלחה»?",o:["כי מי שמקבל מתנה דואג לה יותר משהיה דואג לפיקדון שהופקד אצלו","כי הנושא באחריות למשימה, ותהא הקשה ביותר, בדרך כלל יתגבר על המכשולים","כי מי שנושא באחריות פטור מן הקשיים והלבטים שבזכות הבחירה","כי מי שנושא באחריות אינו נדרש להנחיל את הלימוד לדור הבא"],c:1,e:"סיכום, חלק ה (פיקדון = אחריות, וכן שקף 17): מי שנושא על גבו את האחריות למשימה, ותהא הקשה ביותר, «בדרך כלל יתגבר על כל המכשולים שבדרך כדי להגיע למטרה». הסיכום קובע את ההפך מן המסיח הראשון: על פיקדון דואגים יותר משהיו דואגים למתנה."},
/* יחידה 3 · מן הנביאים אל החכמים */
{l:3,t:"מן הנביאים אל החכמים",s:"סיכום",q:"לפי התוספתא (סוטה יג, ג), מתי «פסקה רוח הקודש מישראל»?",o:["משחרב בית המקדש הראשון בידי נבוכדנצר","משמתו הנביאים האחרונים: חגי, זכריה ומלאכי","משמת עזרא הסופר ונסתיים שלטון נחמיה","משמת שמעון הצדיק, משיירי כנסת הגדולה"],c:1,e:"התוספתא קובעת: «משמתו נביאים אחרונים: חגי, זכריה ומלאכי, פסקה רוח הקודש מישראל» (סיכום, חלק א; שקף 5). החורבן ב־586 קדם לכך – הנביאים האלה פעלו דווקא אחרי השיבה, בעלייה הראשונה."},
{l:3,t:"מן הנביאים אל החכמים",s:"סיכום",q:"איזה מן הצירופים הבאים של ציטוט ומקורו שגוי?",o:["«ברכות ותפילות, קדושות והבדלות» – בבלי, ברכות לג ע״א","«רני ושמחי בת ציון» – זכריה ב, יד","«לכל אדם ישנה» – אבות דרבי נתן, נוסח א, פרק ג","«פסקה רוח הקודש מישראל» – ירושלמי, ברכות ז, ג"],c:3,e:"«משמתו נביאים אחרונים... פסקה רוח הקודש מישראל» מקורו בתוספתא, סוטה יג, ג (סיכום, חלק א). הירושלמי, ברכות ז, ג הוא המקור ל«החזירו הגדולה ליושנה». שאר הצירופים נכונים (סיכום, חלקים ב, ג, ה)."},
{l:3,t:"מן הנביאים אל החכמים",s:"שאלות חזרה",q:"מדוע נחשב המעבר מן הנביאים לאנשי כנסת הגדולה לראשית עולמם של החכמים?",o:["כי אנשי כנסת הגדולה המשיכו לקבל התגלות אלוהית כמו הנביאים","כי משה מסר את התורה ישירות לאנשי כנסת הגדולה במעמד סיני","כי שלב המסירה האחרון הוא גם השלב הראשון בעולמם של החכמים","כי הזקנים העבירו את סמכותם לחכמים עוד לפני תקופת הנביאים"],c:2,e:"לפי הסיכום (חלק א), השלב האחרון בהשתלשלות המסירה – מן הנביאים לאנשי כנסת הגדולה – הוא גם השלב הראשון בעולמם של חכמים, עם הסתלקות הנבואה. אנשי כנסת הגדולה פעלו כהמשך לנביאים, אך ללא כוח ההתגלות (חלק ב)."},
{l:3,t:"מן הנביאים אל החכמים",s:"סיכום",q:"לפי הסיכום, מה הייתה משמעות נוכחותו של הנביא לימין המנהיגים מנחילי התורה?",o:["כולם ידעו שדבר ה׳ קיים בעולם, גם אם בפועל לא הקשיבו לו","העם הקפיד לשמוע בקול הנביא, ולכן לא נזקק לגזרות ולסייגים","המנהיגים נפטרו מן הצורך ללמד את העם תורה בבתי המדרש","הנביא שימש דיין עליון והכריע בעצמו בכל מחלוקת שבעם"],c:0,e:"הסיכום (חלק א) מתאר שהנבואה «השרתה ביטחון דתי עצום»: כשהנביא עמד לימין המנהיגים, ידעו כולם שדבר ה׳ קיים בעולם – «גם אם בפועל לא הקשיבו לו». לכן האפשרות שלפיה העם הקפיד לשמוע בקול הנביא סותרת את הסיכום."},
{l:3,t:"מן הנביאים אל החכמים",s:"סיכום",q:"מה הייתה כנסת הגדולה, לפי הסיכום?",o:["בית הדין של הזקנים, שקיבלו את התורה מיהושע","בית המדרש של בית הלל, שפעל במאה הראשונה לספירה","מועצת הנביאים האחרונים, שפעלה בבבל לפני הצהרת כורש","המוסד העליון בראשית הבית השני, שקבע תקנות בענייני דת"],c:3,e:"לפי הסיכום (חלק א; שקף 6), כנסת הגדולה הייתה «המוסד העליון בתחילת ימי הבית השני, שהיה ממונה על הסדרת מנהגים וקביעת תקנות בענייני דת». הזקנים הם חוליה מוקדמת יותר בשלשלת, ובית הלל פעל מאות שנים מאוחר יותר."},
{l:3,t:"מן הנביאים אל החכמים",s:"סיכום",q:"כמה חכמים מנתה כנסת הגדולה, וכמה מהם מוכרים לנו בשמם?",o:["120 חכמים; אחד מהם מוכר בשמו – שמעון הצדיק","שבעים חכמים; אחד מהם מוכר בשמו – עזרא הסופר","שבעים חכמים; שמותיהם מתועדים בספר נחמיה","120 חכמים; שלושה מוכרים בשמם – חגי, זכריה ומלאכי"],c:0,e:"הסיכום (חלק א; שקף 6): כנסת הגדולה מנתה 120 חכמים, ושמותיהם אינם ידועים – החכם היחיד המוכר בשמו הוא «שמעון הצדיק משיירי כנסת הגדולה». חגי, זכריה ומלאכי הם הנביאים האחרונים שמסרו את התורה לכנסת הגדולה, לא חבריה."},
{l:3,t:"מן הנביאים אל החכמים",s:"סיכום",q:"מה מהבאים אינו נכון לגבי אנשי כנסת הגדולה?",o:["הם פעלו מימי עזרא הסופר ועד לעליית היוונים","הם מנו מאה ועשרים חכמים בראשית ימי הבית השני","שמותיהם של רובם מתועדים ומוכרים לנו היטב","שמעון הצדיק מתואר כאחד משייריה של הכנסת"],c:2,e:"לפי הסיכום (חלק א), שמותיהם של אנשי כנסת הגדולה «אינם ידועים», והחכם היחיד המוכר בשמו הוא שמעון הצדיק «משיירי כנסת הגדולה». שאר הקביעות – 120 חכמים, מעזרא הסופר ועד לעליית היוונים – מופיעות בסיכום."},
{l:3,t:"מן הנביאים אל החכמים",s:"סיכום",q:"«למה נקראו אנשי כנסת הגדולה? שהחזירו הגדולה ליושנה». מה מסביר המשפט, ומהו מקורו?",o:["את פשר השם «כנסת הגדולה»; בבלי, ברכות לג ע״א","את סיבת הסתלקות הנבואה; תוספתא, סוטה יג, ג","את פשר השם «כנסת הגדולה»; ירושלמי, ברכות ז, ג","את תקנת הברכות והתפילות; ירושלמי, ברכות ז, ג"],c:2,e:"בטבלת מושגי המפתח (סיכום, חלק ו) ובשקף 6: «החזירו הגדולה ליושנה» הוא פשר השם «כנסת הגדולה», ומקורו בירושלמי, ברכות ז, ג. הבבלי ברכות לג ע״א הוא המקור לתקנת הברכות והתפילות, לא לפשר השם."},
/* יחידה 3 · גלות בבל ושיבת ציון */
{l:3,t:"גלות בבל ושיבת ציון",s:"סיכום",q:"מה אירע בשנים 586 ו־539 לפנה״ס, לפי סדרן?",o:["כיבוש בבל בידי כורש; חורבן הבית בידי נבוכדנצר","חורבן הבית בידי נבוכדנצר; כיבוש בבל בידי כורש","חורבן הבית בידי נבוכדנצר; עליית עזרא ונחמיה","גלות בבל; הנחת יסודות הבית השני בידי זרובבל"],c:1,e:"לפי הטבלה (סיכום, חלק ב; שקף 7): ב־586 לפנה״ס חרב הבית הראשון בידי נבוכדנצר ועם ישראל גלה לבבל; ב־539 לפנה״ס כבש כורש מלך פרס את בבל – ראשית שיבת ציון. היפוך הסדר מטעה. עליית עזרא (458) ושלטון נחמיה (445) באו מאוחר הרבה יותר."},
