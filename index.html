{l:3,t:"גלות בבל ושיבת ציון",s:"סיכום",q:"מה מהבאים אינו מאפיין של מדיניות שיבת ציון הפרסית, לפי הסיכום?",o:["היא נשענה על עיקרון של חופש דת לכל נתיני האימפריה","השיבה נעשתה על חשבון קופת המדינה, כאינטרס של השלטון","היא העניקה ליהודים מעמד מועדף על פני שאר הנתינים","היא העניקה לנתינים השבים לארצם אוטונומיה מנהלית"],c:2,e:"הסיכום (חלק ב; שקף 7) מדגיש שהמדיניות «לא הייתה מכוונת דווקא כלפי היהודים אלא כלפי כל נתיני האימפריה הפרסית». היא נשענה על חופש דת ואוטונומיה מנהלית, ומומנה מקופת המדינה – ולכן אין בה מעמד מועדף ליהודים."},
{l:3,t:"גלות בבל ושיבת ציון",s:"סיכום",q:"מדוע, לפי הסיכום, מימן השלטון הפרסי את שיבת ציון מקופת המדינה?",o:["כי ראה חשיבות בהושבת נתיניו בגבולה המערבי של הממלכה","כי ביקש לפצות את היהודים על החורבן שהמיט עליהם נבוכדנצר","כי ראשי העולים התחייבו לשלם לו מס מיוחד בעבור השיבה","כי זרובבל ויהושע הכהן הגדול שכנעו את כורש לעשות זאת"],c:0,e:"לפי הסיכום (חלק ב; שקף 7), שיבת ציון נעשתה על חשבון קופת המדינה הפרסית «כאינטרס של השלטון, שגם ראה חשיבות בהושבת נתיניו בגבולה המערבי של הממלכה». המדיניות כוונה לכל הנתינים, ולכן אינה פיצוי מיוחד ליהודים על החורבן."},
{l:3,t:"גלות בבל ושיבת ציון",s:"סיכום",q:"מי עמדו בראש העלייה הראשונה מבבל?",o:["זרובבל ויהושע הכהן הגדול","עזרא הסופר ונחמיה","הנביאים חגי, זכריה ומלאכי","שמעון הצדיק ואנשי כנסת הגדולה"],c:0,e:"לפי הסיכום (חלק ב; שקפים 7–8), העלייה הראשונה, שהחלה סמוך להצהרת כורש, הייתה בראשות זרובבל ויהושע הכהן הגדול. עזרא ונחמיה עמדו בראש העלייה השנייה; חגי, זכריה ומלאכי שייכים לעלייה הראשונה, אך כנביאים ולא כראשיה."},
{l:3,t:"גלות בבל ושיבת ציון",s:"סיכום",q:"מי היו העולים בעלייה הראשונה, לפי תיאור היחידה?",o:["בעיקר כהנים ובני אבות מיוחסים ששירתו בבית הראשון","בעיקר חכמים ותלמידיהם, שיצאו מבתי המדרש שבבבל","בעיקר עשירים, שמימנו בעצמם את הקמת בית המקדש","קבוצה גדולה של חסרי ייחוס, ולצידה יהודים שהתבוללו"],c:3,e:"לפי הסיכום (חלק ב; שקף 8), העולים – כמה עשרות אלפים – היו מורכבים מכמה קבוצות, ובהן «קבוצה גדולה של אנשים חסרי ייחוס» ויהודים שהתבוללו בעקבות נישואי תערובת. גם המימון לא בא מן העולים אלא מקופת המדינה הפרסית."},
{l:3,t:"גלות בבל ושיבת ציון",s:"סיכום",q:"מה נכון לגבי יהודי בבל בעת העלייה הראשונה?",o:["רובם עלו לארץ, ובראשם משפחות הכהונה","רובם עלו לארץ, ובבבל נותרו בעיקר המתבוללים","רובם נשארו בבבל, והעולים מנו כמה עשרות אלפים","רובם עלו מאוחר יותר, יחד עם עזרא ונחמיה"],c:2,e:"הסיכום (חלק ב; שקף 8) קובע: «רוב היהודים נשארו בבבל», והעולים מנו כמה עשרות אלפי אנשים. דווקא המתבוללים וחסרי הייחוס נמנו עם העולים, ולכן האפשרות שלפיה בבבל נותרו המתבוללים הפוכה לתיאור."},
{l:3,t:"גלות בבל ושיבת ציון",s:"סיכום",q:"מה מהבאים אינו נעשה בידי העולים בעלייה הראשונה, לפי הסיכום?",o:["בנייה מחדש של העיר ירושלים עצמה","הקמת יסודות בית המקדש השני","עלייה בהנהגת זרובבל ויהושע הכהן הגדול","נבואה בקרבם מפי חגי, זכריה ומלאכי"],c:0,e:"העולים הראשונים לא עסקו בבנייה מחדש של העיר עצמה: לפי הסיכום (חלק ב; שקף 8) הם «הקימו את יסודות בית המקדש השני, אך לא בנו את ירושלים». בניית חומות העיר מיוחסת במצגת (שקף 7) לעלייה השנייה. שאר הפריטים נכונים לגבי העלייה הראשונה."},
{l:3,t:"גלות בבל ושיבת ציון",s:"סיכום",q:"מתי התנבא זכריה «רני ושמחי בת ציון, כי הנני בא ושכנתי בתוכך» (זכריה ב, יד), ומה פשר «הנני בא»?",o:["ערב חורבן הבית הראשון; ה׳ עתיד לשוב אל עמו אחרי הגלות","בעלייה השנייה; עזרא הסופר שב לירושלים עם התורה","בימי בית שמאי ובית הלל; התורה חוזרת אל כל אדם","בעלייה הראשונה; הקב״ה חוזר איתנו הביתה"],c:3,e:"לפי הסיכום (חלק ב; שקף 8), זכריה התנבא בתקופת העלייה הראשונה, שלוותה «בתקוות רבות שנכזבו», ופשר «הנני בא» הוא «הקב״ה חוזר איתנו הביתה». עזרא עלה מאוחר יותר, בעלייה השנייה, ופעל ללא כוח ההתגלות שהיה לנביאים."},
{l:3,t:"גלות בבל ושיבת ציון",s:"סיכום",q:"מה נכון לגבי העלייה השנייה, לפי הסיכום?",o:["בה הקימו זרובבל ויהושע את יסודות בית המקדש השני","עזרא ונחמיה פעלו בה בכוח התגלות אלוהית, כמו הנביאים","בה פעלו הנביאים חגי, זכריה ומלאכי ומסרו את התורה","עליית עזרא ושלטון נחמיה פתחו בה את תקופת כנסת הגדולה"],c:3,e:"לפי הסיכום (חלק ב), עליית עזרא ובסמוך לה שלטון נחמיה פותחות את תקופת «אנשי כנסת הגדולה»; פעולתם באה כהמשך לנביאים – «אך ללא כוח ההתגלות של אלוהים לנביאים». יסודות הבית והנביאים האחרונים שייכים לעלייה הראשונה."},
{l:3,t:"גלות בבל ושיבת ציון",s:"סיכום",q:"באילו שנים, לפי הסיכום, עלה עזרא והחל שלטונו של נחמיה?",o:["עזרא – 445 לפנה״ס; נחמיה – 458 לפנה״ס","עזרא – 458 לפנה״ס; נחמיה – 445 לפנה״ס","עזרא – 539 לפנה״ס; נחמיה – 458 לפנה״ס","עזרא – 586 לפנה״ס; נחמיה – 539 לפנה״ס"],c:1,e:"הסיכום (חלק ב) קובע: «עלייתו של עזרא (458 לפנה״ס), ובסמוך לה שלטונו של נחמיה (445 לפנה״ס)». ההיפוך בין השנים מטעה: עזרא קדם לנחמיה. 539 היא שנת כיבוש בבל בידי כורש, ו־586 – שנת החורבן."},
{l:3,t:"גלות בבל ושיבת ציון",s:"שאלות חזרה",q:"איזה צירוף מתאר נכון את עיקרי המדיניות הפרסית ואת ראשי שתי העליות, לפי סדרן?",o:["חופש דת ואוטונומיה מנהלית; זרובבל ויהושע, ואחריהם עזרא ונחמיה","חופש דת ואוטונומיה מנהלית; עזרא ונחמיה, ואחריהם זרובבל ויהושע","כפייה דתית ושלטון צבאי ישיר; זרובבל ויהושע, ואחריהם עזרא ונחמיה","מימון שהוטל על העולים עצמם; חגי וזכריה, ואחריהם עזרא ונחמיה"],c:0,e:"שאלת חזרה מסוף הסיכום. המדיניות הפרסית נשענה על חופש דת ואוטונומיה מנהלית (חלק ב); בראש העלייה הראשונה עמדו זרובבל ויהושע הכהן הגדול, ובראש השנייה – עזרא (458) ונחמיה (445). היפוך הסדר בין העליות שגוי."},
/* יחידה 3 · מפעלם: ברכות, תפילות וסייגים */
{l:3,t:"מפעלם: ברכות, תפילות וסייגים",s:"סיכום",q:"מה מהבאים אינו אחת משלוש הפעולות הראשונות של אנשי כנסת הגדולה?",o:["העברת מרכז עבודת ה׳ מן המקדש אל הבית והקהילה","הוצאת התורה לרשות הרבים, ללא בידול שבטי ומעמדי","חיבור האדם הפשוט לצד הרוחני באמצעות ברכות ותפילות","ריכוז עבודת ה׳ כולה בקורבנות שבבית המקדש"],c:3,e:"שלוש הפעולות הראשונות (סיכום, חלק ג; שקף 9) הן העברת מרכז עבודת ה׳ מן המקדש לבית ולקהילה, הוצאת התורה לרשות הרבים, וחיבור האדם הפשוט לצד הרוחני באמצעות ברכות ותפילות. ריכוז העבודה בקורבנות המקדש הוא ההפך מן המהפכה שחוללו."},
{l:3,t:"מפעלם: ברכות, תפילות וסייגים",s:"שאלות חזרה",q:"מדוע נחשבו הפעולות הראשונות של אנשי כנסת הגדולה למהפכה?",o:["כי ביטלו את עבודת הקורבנות והחליפו אותה בלימוד בבית המדרש","כי העבירו את הסמכות הדתית מן החכמים אל הכהנים ששבו מבבל","כי קראו לכל יהודי ליטול חלק בעבודת ה׳, ולא להישען על הקורבנות","כי הגבילו את לימוד התורה לבני אבות מיוחסים ולחכמים מוכשרים"],c:2,e:"הסיכום (חלק ג) מגדיר את המהפכה: «קריאה לכל יהודי ליטול חלק בעבודת ה׳, ולא להישען על הידיעה שבבית המקדש מקריבים קורבנות לכבודו ובשמו». הסיכום אינו אומר שביטלו את הקורבנות – אלא שהעבירו את מרכז העבודה גם אל הבית והקהילה."},
{l:3,t:"מפעלם: ברכות, תפילות וסייגים",s:"סיכום",q:"מה תיקנו אנשי כנסת הגדולה לישראל, לפי הבבלי (ברכות לג ע״א)?",o:["קורבנות ונסכים, תרומות ומעשרות","תעניות וצומות, קינות והספדים","משמרות כהונה, שירה ונגינה במקדש","ברכות ותפילות, קדושות והבדלות"],c:3,e:"בבבלי ברכות לג ע״א (סיכום, חלק ג; שקף 9): «אנשי כנסת הגדולה תקנו להם לישראל ברכות ותפילות, קדושות והבדלות». התקנות נועדו לחבר את האדם הפשוט לצד הרוחני של חייו, ולא לחזק את עבודת המקדש והקורבנות."},
{l:3,t:"מפעלם: ברכות, תפילות וסייגים",s:"סיכום",q:"לשם מה, לפי הסיכום, תיקנו אנשי כנסת הגדולה ברכות ותפילות?",o:["כדי להבדיל בין עבודת הכהנים במקדש לבין שאר העם","כדי למסד את הקשר בין האדם הפשוט לבין אלוהים","כדי להחליף את קריאת התורה, שהעם התקשה להבין","כדי להרחיק את העם מחילול השבת בשדה ובגת"],c:1,e:"לפי הסיכום (חלק ג), אנשי כנסת הגדולה הבינו ש«כדי לחבר את האדם הפשוט לצד הרוחני והפנימי של חייו, יש צורך למסד את הקשר בינו לבין אלוהים». הרחקה מחילול השבת שייכת לסייגים, כמו דיני המוקצה, ולא לתקנת הברכות."},
{l:3,t:"מפעלם: ברכות, תפילות וסייגים",s:"סיכום",q:"מה ראה נחמיה בירושלים, לפי תיאור היחידה?",o:["אכילת עוף בחלב ובשר בחלב בבתי העולים","דריכת ענבים בגת ועבודות חקלאות בשבת","אכילת קטניות בפסח בקרב חסרי הייחוס","הדלקת אש בשבת אחרי השקיעה בירושלים"],c:1,e:"הסיכום (חלק ג; שקף 10): נחמיה ראה «חילול השבת ההמוני בירושלים: דריכת ענבים בגת ועבודות חקלאות בשבת» – השבת הייתה יום חול. עוף בחלב וקטניות בפסח מופיעים ביחידה כדוגמאות לסייגים, לא כמה שראה נחמיה."},
{l:3,t:"מפעלם: ברכות, תפילות וסייגים",s:"סיכום",q:"איזה סייג מציגה היחידה כדוגמה לתגובה על חילול השבת שראה נחמיה?",o:["דיני מוקצה בשבת","הדלקת נרות שבת לפני השקיעה","איסור קטניות בפסח","המתנה בין בשר לחלב"],c:0,e:"בסיכום (חלק ג) ובשקף 10, הדוגמה ל«ועשו סייג לתורה» בעקבות חילול השבת בימי נחמיה היא דיני «מוקצה» בשבת. הדלקת נרות לפני השקיעה היא אמנם סייג הקשור לשבת, אך היא מופיעה ברשימת הדוגמאות הכללית (חלק ד) ולא בסיפור נחמיה."},
{l:3,t:"מפעלם: ברכות, תפילות וסייגים",s:"סיכום",q:"מדוע, לפי הסיכום, לא ניתן היה להתחיל את הרפורמה ב«תיקון קוסמטי» של קריאת התורה?",o:["כי העם התרחק מן התורה עד כדי כך שנדרש שינוי מטלטל","כי נחמיה אסר לקרוא בתורה עד שיושלם בניין המקדש","כי הנביאים האחרונים התנגדו לכל שינוי בסדר הקריאה","כי השלטון הפרסי אסר על הנתינים להתכנס לקריאה בציבור"],c:0,e:"הסיכום (חלק ג; שקף 10): «המרחק מן התורה היה גדול כל כך, עד שלא ניתן היה להתחיל את הרפורמה בתיקון קוסמטי של קריאת התורה; היה צורך בשינוי מטלטל יותר». השלטון הפרסי דווקא העניק חופש דת, ולכן לא אסר התכנסות."},
{l:3,t:"מפעלם: ברכות, תפילות וסייגים",s:"שאלות חזרה",q:"כיצד ממחישים דיני המוקצה בימי נחמיה את «ועשו סייג לתורה»?",o:["נחמיה התיר מלאכות קלות בשבת, כדי שהעולים יוכלו לשרוד","מול חילול שבת המוני נקבעה גדר שמרחיקה את האדם מן העבירה","דיני המוקצה הם מלאכה מן התורה, שנחמיה החזיר לתוקפה","דיני המוקצה נועדו לחבר את האדם הפשוט לברכות ולתפילות"],c:1,e:"שאלת חזרה מסוף הסיכום. הצורך בכללים המרחיקים מן העבירה בא במקביל לערעור מעמד ההלכה: מול חילול השבת ההמוני נקבעו דיני מוקצה – גדר סביב איסור המלאכה (חלק ג; שקף 14). המוקצה אינו מלאכה מן התורה אלא סייג שגזרו חז״ל."},
/* יחידה 3 · שלושת הדברים */
{l:3,t:"שלושת הדברים",s:"סיכום",q:"איזו התאמה בין האמירה לבין קהל היעד שלה נכונה?",o:["«הוו מתונים בדין» – אל החכמים כמורים העומדים בראש בית מדרש","«והעמידו תלמידים הרבה» – אל הדיינים בבית הדין","«ועשו סייג לתורה» – אל החכמים כמחוקקים ופוסקי הלכה","«ועשו סייג לתורה» – אל הדיינים השומעים את העדים"],c:2,e:"לפי טבלת חלק ד בסיכום (שקפים 12–14): «הוו מתונים בדין» – אל הדיינים; «והעמידו תלמידים הרבה» – אל החכמים כמורים ומלמדים; «ועשו סייג לתורה» – אל החכמים כמחוקקים ופוסקי הלכה. בשאר הצירופים הוחלפו קהלי היעד."},
{l:3,t:"שלושת הדברים",s:"סיכום",q:"מה מהבאים אינו נמנה בסיכום בין רכיבי המתינות בדין?",o:["הקשבה בסבלנות לכל אחד ואחד מן העדים","הכרעה מהירה שאינה מעכבת את הדין","בדיקת מהימנות העדים והצלבת המידע ביניהם","קריאת תקדימים ודיון בעובדות לעומקן"],c:1,e:"לפי הסיכום (חלק ד; שקף 12), המתינות כוללת הקשבה לכל העדים, חקירתם ובדיקת מהימנותם, הצלבת מידע, דיון בעובדות וקריאת תקדימים – «ולא הכרעה בחיפזון אלא ביישוב הדעת». הכרעה מהירה היא ההפך מן המתינות."},
{l:3,t:"שלושת הדברים",s:"סיכום",q:"שופטת מקפידה לשמוע את כל העדים, בודקת את מהימנותם ומעיינת בתקדימים לפני שהיא פוסקת. איזו מן האמירות היא מגלמת?",o:["«והעמידו תלמידים הרבה»","«ועשו סייג לתורה»","«לכל אדם ישנה»","«הוו מתונים בדין»"],c:3,e:"השופטת מגלמת את «הוו מתונים בדין»: הקשבה לכל העדים, בדיקת מהימנותם וקריאת תקדימים הם רכיבי המתינות בדין שמונה הסיכום (חלק ד; שקף 12) – «מידה טובה וראויה לכל שופט». הסייג מופנה אל המחוקקים, ו«לכל אדם ישנה» הוא דברי בית הלל על קבלת תלמידים."},
{l:3,t:"שלושת הדברים",s:"סיכום",q:"ראש ישיבה מבטל את מבחני הכניסה ומקבל כל מי שרוצה ללמוד, אף שחלק מן הנכנסים חלשים. איזו אמירה הוא מגשים?",o:["«והעמידו תלמידים הרבה»","«הוו מתונים בדין»","«ועשו סייג לתורה»","«אל ישנה אדם אלא למי שהוא חכם»"],c:0,e:"«והעמידו תלמידים הרבה» מופנה אל החכמים כמורים, ופירושו הרחבת מעגל הלומדים – גם במחיר כניסת תלמידים חלשים (סיכום, חלק ד; שקף 13). «אל ישנה אדם אלא למי שהוא חכם» הוא דברי בית שמאי, שמציבים תנאי כניסה – ההפך מן המעשה הזה."},
{l:3,t:"שלושת הדברים",s:"סיכום",q:"כאשר הכמות מתנגשת עם האיכות, מה מעדיף המאמר «והעמידו תלמידים הרבה», ומדוע?",o:["את הכמות – כדי להגדיל תורה בישראל","את האיכות – כדי לשמור על רמתו של בית המדרש","את האיכות – כדי שלא ייכנסו תלמידים שאינם ראויים","את הכמות – כדי לחזק את מעמדם הכלכלי של החכמים"],c:0,e:"הסיכום (חלק ד; שקף 13): לכאורה כדאי לקבל את המוכשרים ביותר, «אבל המאמר מעדיף את הכמות, גם במקום שהיא מתנגשת עם האיכות, והכול כדי להגדיל תורה בישראל». החשש מתלמידים שאינם ראויים הוא הסיכון שהמאמר מוכן לקחת."},
{l:3,t:"שלושת הדברים",s:"סיכום",q:"הורה אוסר על ילדו הקטן לגעת בגפרורים כלל, כדי שלא יגיע לידי הדלקת אש. איזה עיקרון מן היחידה מקביל להתנהגותו?",o:["«הוו מתונים בדין» – לא לחרוץ דין בחיפזון","«ועשו סייג לתורה» – גדר המרחיקה מן הקצה עצמו","«והעמידו תלמידים הרבה» – להרבות לומדים","«החזירו הגדולה ליושנה» – להשיב את הסדר הקודם"],c:1,e:"הסייג הוא «גדר המרחיקה את האדם מהגעה אל הקצה ממש, כדי שלא ייכשל» (סיכום, חלק ד; שקף 14). כך גם המוקצה: חז״ל אסרו לגעת בחפצים שנועדו למלאכה, כדי שלא ישתמש בהם מתוך הרגל. «החזירו הגדולה ליושנה» הוא פשר שם הכנסת, לא עיקרון התנהגות."},
{l:3,t:"שלושת הדברים",s:"סיכום",q:"מהו «סייג» במובן של «ועשו סייג לתורה»?",o:["פירוש של פסוקי התורה, שמקל על הבנתם בקרב הציבור","עונש שמטילים הדיינים על מי שעבר על חוקי התורה","גדר מטאפורית סביב חוקי התורה, שמרחיקה מן החטא","רשימת תנאים שקובעת מי ראוי ללמוד תורה בבית המדרש"],c:2,e:"לפי הסיכום (חלק ד; שקף 14), הסייג הוא «גדר מטאפורית סביב חוקי התורה, כדי שאנשים לא יתקרבו אל החטא כלל», והאמירה מופנית אל החכמים כמחוקקים. תנאי קבלה לבית המדרש שייכים לוויכוח בין בית שמאי לבית הלל, לא לסייג."},
{l:3,t:"שלושת הדברים",s:"סיכום",q:"מה מהבאים אינו מופיע ביחידה כדוגמה לסייג לתורה?",o:["איסור עוף בחלב","איסור אכילת קטניות בפסח","הדלקת נרות שבת לפני השקיעה","בחינת כניסה לבית המדרש"],c:3,e:"הדוגמאות לסייגים (סיכום, חלק ד; שקף 14): דיני מוקצה, איסור עוף בחלב, המתנה בין בשר לחלב, הדלקת נרות שבת לפני השקיעה ואיסור קטניות בפסח. «בחינת כניסה» עולה בחלק ה, בהקשר של תנאי בית שמאי לקבלת תלמידים – ובית הלל דוחה אותה."},
{l:3,t:"שלושת הדברים",s:"מצגת",q:"לפי ההמחשה במצגת, מדוע אסרו חז״ל להזיז בשבת חפצים כמו עט, מפתחות או פטיש?",o:["כי עצם הזזתם נחשבת בתורה למלאכה האסורה בשבת","כדי שאדם לא יחזיק אותם וישתמש בהם מתוך הרגל","כי נחמיה גילה שהעולים השתמשו בהם בדריכת ענבים","כי הם שימשו בבית המקדש, ואסור להוציאם ממנו"],c:1,e:"שקף 14: התורה אוסרת מלאכה בשבת, כמו כתיבה או הדלקת אש, וחז״ל אסרו «אפילו להזיז או לגעת בחפצים שנועדו למלאכה... כדי שאדם לא יחזיק אותם וישתמש בהם מתוך הרגל». ההזזה עצמה אינה המלאכה שהתורה אוסרת – זה בדיוק הסייג."},
/* יחידה 3 · בית שמאי ובית הלל */
{l:3,t:"בית שמאי ובית הלל",s:"סיכום",q:"מהם ארבעת התנאים שקבע בית שמאי למי שראוי ללמוד משנה?",o:["חכם, צדיק, חסיד וכשר","עניו, צדיק, חסיד וכשר","חכם, עניו, בן אבות ועשיר","מתון, חכם, עניו ועשיר"],c:2,e:"באבות דרבי נתן (נוסח א, פרק ג), בית שמאי אומרים: «אל ישנה אדם אלא למי שהוא חכם ועניו ובן אבות ועשיר» (סיכום, חלק ה; שקף 16). «צדיקים חסידים וכשרים» הם דווקא מה שיצא, לדברי בית הלל, מן הפושעים שנתקרבו לתורה."},
{l:3,t:"בית שמאי ובית הלל",s:"סיכום",q:"לפי הסיכום, מה מייצג התנאי «בן אבות» בשיטת בית שמאי?",o:["ייחוס משפחתי","כישורים אינטלקטואליים","תכונות אופי","מצב כלכלי מעולה"],c:0,e:"הסיכום (חלק ה; שקף 16) מפרש: «חכם» – כישורים אינטלקטואליים; «עניו» – תכונות אופי; «בן אבות» – ייחוס משפחתי; «עשיר» – מצב כלכלי מעולה. «בן אבות» אינו מצב כלכלי – זה התנאי «עשיר»."},
{l:3,t:"בית שמאי ובית הלל",s:"סיכום",q:"מה מהבאים אינו מתאר את עמדת בית הלל?",o:["יש ללמד כל אדם, ללא קשר לנתוניו הכלכליים והחברתיים","גם פושע יכול להתקרב לתורה ולהיעשות לאדם אחר","יש לבחון כל מועמד לפני שילמד משנה","אם לא נתיר לפושע להיכנס לבית המדרש, נאבד אותו"],c:2,e:"לפי הסיכום (חלק ה; שקף 16), בית הלל אומרים «לכל אדם ישנה», ואצלם אין «שום בחינת כניסה לבית המדרש». לכן הדרישה לבחון כל מועמד לפני שילמד משנה אינה עמדתם – היא קרובה לבית שמאי, שהציבו ארבעה תנאים. שאר ההיגדים, כולל הפושע שמתקרב לתורה, הם דברי בית הלל."},
{l:3,t:"בית שמאי ובית הלל",s:"שאלות חזרה",q:"איזו עמדה תואמת את «והעמידו תלמידים הרבה», ומדוע?",o:["עמדת בית שמאי – כי היא מכשירה אליטות חדשות שילמדו את העם","עמדת בית הלל – כי היא מעדיפה את האיכות על פני הכמות","עמדת בית שמאי – כי ארבעת התנאים מגדילים את מספר הלומדים","עמדת בית הלל – כי היא מלמדת כל אדם, ואף פושע יכול להשתנות"],c:3,e:"שאלת חזרה מסוף הסיכום. לפי חלק ה, בית הלל, המלמדים כל אדם ומאמינים שגם פושע יכול להתקרב לתורה, פועלים «ברוח משנתנו» – «והעמידו תלמידים הרבה». בית שמאי מקימים מוסד של אליטות; והמשנה מעדיפה דווקא את הכמות, לא את האיכות."},
{l:3,t:"בית שמאי ובית הלל",s:"סיכום",q:"מהו המקור לדברי בית שמאי ובית הלל בשאלה למי ראוי ללמד?",o:["אבות דרבי נתן, נוסח א, פרק ג","מסכת אבות, פרק א, משנה א","בבלי, ברכות לג ע״א","ירושלמי, ברכות ז, ג"],c:0,e:"המחלוקת מובאת באבות דרבי נתן, נוסח א, פרק ג (סיכום, חלק ה; שקף 16). מסכת אבות פרק א משנה א היא המשנה של אנשי כנסת הגדולה עצמה – «והעמידו תלמידים הרבה» – שאותה המחלוקת מפרשת, ולא מקור המחלוקת."},
{l:3,t:"בית שמאי ובית הלל",s:"סיכום",q:"מתי, לפי הסיכום, העסיקה את בית שמאי ובית הלל השאלה «תלמידים הרבה» או תלמידים מצטיינים?",o:["במאה הראשונה לספירה, כמה מאות שנים אחר כך","בימי עזרא ונחמיה, בראשית תקופת כנסת הגדולה","בימי העלייה הראשונה, בהנהגת זרובבל ויהושע","ערב עליית היוונים, בסוף תקופת כנסת הגדולה"],c:0,e:"הסיכום (חלק ה) קובע שהשאלה העסיקה את בית שמאי ובית הלל «כמה מאות שנים מאוחר יותר, במאה הראשונה לספירה». תקופת כנסת הגדולה עצמה – מעזרא ועד לעליית היוונים – הסתיימה בערך ב־300 לפנה״ס."},
{l:3,t:"בית שמאי ובית הלל",s:"סיכום",q:"מכינה יוקרתית מקבלת מועמדים מצטיינים, בעלי אופי נעים, ממשפחות ידועות ובעלי אמצעים, כדי להכשיר מהם את מנהיגי העתיד. לאיזו עמדה היא קרובה?",o:["לעמדת בית הלל – בית מדרש הסומך על יכולתו לחנך כל אדם","לעמדת בית שמאי – מוסד של אליטות שמכשיר אליטות חדשות","ל«והעמידו תלמידים הרבה» – הרחבת מעגל הלומדים","ל«ועשו סייג לתורה» – הרחקת האדם מן החטא"],c:1,e:"המכינה דורשת את ארבעת התנאים של בית שמאי – חכם, עניו, בן אבות ועשיר – והסיכום (חלק ה) מתאר את שיטתם כ«מוסד של אליטות, המיועד להכשיר אליטות חדשות». בית הלל, ברוח «והעמידו תלמידים הרבה», פותחים את הדלת לכל אדם."},
/* יחידה 3 · מדוע דווקא שלושת הדברים */
{l:3,t:"מדוע דווקא שלושת הדברים",s:"סיכום",q:"מה מהבאים אינו אחד הנימוקים שמביא הסיכום לכך שהמשנה בחרה דווקא בשלוש האמירות?",o:["הן מאפיינות את הכנסת כמוסד שעיצב מדיניות משפטית וחברתית","הן מדריכות את האליטות כיצד לנהוג כדיינים, כמורים וכפוסקים","יש בהן היבטים רלוונטיים לכל חברה ולכל תקופה","הן נאמרו בידי שמעון הצדיק, החכם היחיד המוכר בשמו"],c:3,e:"המשנה מייחסת את שלוש האמירות לאנשי כנסת הגדולה, ולא לשמעון הצדיק – החכם היחיד המוכר בשמו (חלק א), שמשנתו נלמדת ביחידה הבאה (שקף 17). הנימוקים שבסיכום (חלק ד; שקף 15): אמירות של מוסד, הדרכת האליטות, והיבטים רלוונטיים לכל תקופה."},
{l:3,t:"מדוע דווקא שלושת הדברים",s:"סיכום",q:"סטודנטית מעלה לרשת את סיכומי הקורס שלה, כדי שכל מי שמבקש יוכל להיעזר בהם. איזה תרגום «לכל אדם» של שלושת הדברים היא מקיימת?",o:["אל לו לאדם למהר ולחרוץ דין","ראוי לו להפיץ את ידיעותיו בכל תחום ולכל המבקש אותן","אם יגדור את עצמו בסייגים, לא ייתקל בדברים שאין לו בהם עניין","אל ילמד אדם אלא למי שהוא חכם ועניו ובן אבות ועשיר"],c:1,e:"הסיכום (חלק ד, «האמירות פונות אל כל אדם»; שקף 15) מתרגם את «והעמידו תלמידים הרבה» ל«ראוי לו להפיץ את ידיעותיו בכל תחום ולכל המבקש אותן». ההגבלה למי שהוא חכם, עניו, בן אבות ועשיר היא עמדת בית שמאי, ההפך מכך."},
{l:3,t:"מדוע דווקא שלושת הדברים",s:"סיכום",q:"לפי טבלת הסיכום בסוף היחידה, מה הבינו אנשי כנסת הגדולה בעניין המתינות בדין?",o:["שהתורה תחיה ותפעם בלב העם אם תהיה בכל מקום","שיש לגזור גזרות ולעשות סייגים במקום שבו הפרצה גדולה","שהשפיטה הזהירה היא המפתח להתחבר לכל העם","שהדיינים צריכים להיבחר מבין בני אבות ועשירים"],c:2,e:"בטבלת הסיכום (חלק ו; שקף 17): «המתינות בדין – השפיטה המבינה והזהירה – היא המפתח להתקשר ולהתחבר לכל העם». «התורה תחיה... אם תהיה בכל מקום» שייך ל«תלמידים הרבה», והגזרות במקום הפרצה – ל«סייג לתורה»."},
{l:3,t:"מדוע דווקא שלושת הדברים",s:"סיכום",q:"לפי טבלת הסיכום, היכן יש צורך לגזור גזרות ולעשות סייגים?",o:["במקום שבו התורה נלמדת בכל שדרות העם","במקום שבו הדיינים ממהרים לפסוק את הדין","במקום שבו הנבואה עומדת לימין המנהיגים","במקום שבו הפרצה גדולה והשכחה מצויה"],c:3,e:"טבלת הסיכום (חלק ו; שקפים 2 ו־17): «יש צורך לגזור גזרות ולעשות סייגים במקום שבו הפרצה גדולה והשכחה מצויה» – כמו חילול השבת בימי נחמיה. מהירות הדיינים בפסיקה קשורה ל«מתונים בדין», לא לסייג."},
{l:3,t:"מדוע דווקא שלושת הדברים",s:"סיכום",q:"אילו היבטים «רלוונטיים תמיד» מזהה הסיכום בשלוש האמירות?",o:["חופש דת, אוטונומיה מנהלית ומימון מקופת המדינה","חכמה, ענווה, ייחוס משפחתי ומצב כלכלי מעולה","יישוב הדעת, פתיחת מחסומים חברתיים ומקדמי זהירות","ברכות ותפילות, קדושות והבדלות לכל יהודי"],c:2,e:"לפי הסיכום (חלק ד; שקף 15), יש באמירות «היבטים רלוונטיים תמיד: יישוב הדעת, פתיחת מחסומים חברתיים ויצירת מקדמי זהירות». חופש דת ואוטונומיה הם עיקרי המדיניות הפרסית, וארבע התכונות – תנאי בית שמאי."},
{l:3,t:"מדוע דווקא שלושת הדברים",s:"שאלות חזרה",q:"איזה צירוף נכון של אמירה, קהל היעד שלה ותרגומה לכל אדם?",o:["תלמידים הרבה – אל המחוקקים – להפיץ ידיעות לכל המבקש","סייג לתורה – אל המורים – להימנע מדברים שאין בהם עניין","מתונים בדין – אל המורים – לא למהר לקבל תלמידים","מתונים בדין – אל הדיינים – לא למהר ולחרוץ דין"],c:3,e:"שאלת חזרה מסוף הסיכום. לפי חלק ד: «מתונים בדין» – אל הדיינים, ולכל אדם: «אל לו לאדם למהר ולחרוץ דין»; «תלמידים הרבה» – אל המורים; «סייג לתורה» – אל המחוקקים ופוסקי ההלכה. בשאר הצירופים הוחלף קהל היעד."},
{l:3,t:"מדוע דווקא שלושת הדברים",s:"סיכום",q:"אל מי הופנו במקורן ההוראות שבמשנה, לפי הסיכום?",o:["אל העם כולו, ובייחוד אל האדם הפשוט","אל עולם החכמים – האליטות של התקופה","אל השלטון הפרסי ואל פקידיו בארץ","אל הנביאים האחרונים: חגי, זכריה ומלאכי"],c:1,e:"הסיכום (חלק ד) קובע: «כל ההוראות במשנה הופנו במקורן אל עולם החכמים, אך אפשר לתרגם אותן אל כל אדם ואדם», והן «מופנות אל חכמי התקופה – אל האליטות». התרגום אל כל אדם הוא פרשנות נוספת, לא הפנייה המקורית."},

{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"מוכנות",q:"אדם אומר: «אני מאמין שכל התורה ניתנה מן השמיים, חוץ מפסוק אחד שלדעתי משה כתב מדעתו». לפי הלכות תשובה של הרמב״ם, כפי שהובאו ביחידה, מה מעמדו?",o:["הוא בכלל הכופרים בתורה, ואין לו חלק לעולם הבא","הוא אינו כופר, כי הוא מאמין ברוב פסוקי התורה","דינו קל משל הכופר בתורה כולה, וחלקו לעולם הבא נשמר","הוא חוטא, אך אינו פוגע ביסוד השמיני של הרמב״ם"],c:0,e:"הסיכום (חלק ג) ושקף 15, מתוך הלכות תשובה ג, ו-ח: «הכופרים בתורה: האומר שאין התורה מעם ה׳ אפילו פסוק אחד» – אין להם חלק לעולם הבא. גם היסוד השמיני קובע שהתורה «כולה מפי הגבורה», ולכן אין הבדל בין פסוק אחד לתורה כולה."},

{l:1,t:"הרמב״ם ושלושה עשר העיקרים",s:"מוכנות",q:"סטודנט טוען: «שלושה עשר העיקרים הם רשימה פרטית של הרמב״ם, ואין לה מעמד מחייב». לפי החומר על העיקרים, מה נכון?",o:["המניין קיבל מעמד מחייב בעיני רוב היהדות האורתודוקסית","המניין נחשב מחייב בקהילות הספרדים, שבנוסחן נוספו ל«יגדל» שני חרוזים","המניין נקבע כמחייב כבר בחתימת המשנה, בידי רבי יהודה הנשיא","המניין אינו מחייב, אך הכופר בו נחשב אפיקורס ויוצא מכלל ישראל"],c:0,e:"בקובץ העיקרים: «מניין העיקרים שמנה הרמב״ם קיבל מעמד מחייב וכיום נחשב ככזה בעיני הרוב המוחלט של היהדות האורתודוקסית», והכופר בהם נחשב אפיקורס. המשנה נחתמה בשנת 200 לספירה, הרבה לפני הרמב״ם שחי במאה ה-12, ולכן לא ייתכן שהמניין נקבע אז."},
{l:1,t:"שרשרת המסירה",s:"מוכנות",q:"בדיון בכיתה נשאל: במה שונה הדרך שבה נמסרה התורה שבכתב מזו שבה נמסרה התורה שבעל-פה? לפי היחידה, מה התשובה הנכונה?",o:["שבכתב עברה ממשה ליהושע, מחכם לחכם; שבעל-פה הופקדה בידי הכוהנים בני לוי","שבכתב הופקדה בידי הכוהנים בני לוי; שבעל-פה עברה ממשה ליהושע, מחכם לחכם","שתיהן הופקדו בידי הכוהנים בני לוי, עד שרבי יהודה הנשיא כתב את התושב״ע","שבכתב ניתנה לאנשי כנסת הגדולה; שבעל-פה נמסרה לנביאים ולשופטים"],c:1,e:"הסיכום (חלק ד) ושקפים 16-17: משה נתן את התורה שכתב «אל הכוהנים בני לוי... ואל כל זקני ישראל» (דברים לא, ט), ואילו התושב״ע נמסרה בשרשרת «משה... ליהושע, ויהושע לזקנים» (אבות א, א), מדור לדור ומחכם לחכם. האפשרות ההפוכה מחליפה בין שתי דרכי המסירה."},

{l:2,t:"מאפייני מסכת אבות",s:"מוכנות",q:"בטקס סיום נואמת מצטטת «איזהו גיבור? הכובש את יצרו» ומייחסת את הפתגם לספר משלי. מה התיקון הנכון לפי היחידה?",o:["הפתגם מתוך מסכת אבות, מן הפתגמים הידועים שבה","הפתגם מדברי הרמב״ם, בהקדמתו לפירוש המשנה","הפתגם מתוך ספרו של הרב לאו «יחל ישראל»","הפתגם מן החיבור «אבות דרבי נתן»"],c:0,e:"סיכום, חלק א (וכן שקף 6): «איזהו גיבור? הכובש את יצרו» מובא בין הפתגמים הידועים מתוך מסכת אבות. ממשלי מובא ביחידה הפסוק «שמע בני מוסר אביך», להסבר המילה «מוסר»; ו«אבות דרבי נתן» הוא הרחבה של המסכת, לא מקור הפתגם."},
{l:2,t:"מיקומה בסדר נזיקין",s:"מוכנות",q:"דיין מכריע בסכסוך בין שכנים לפי לשון הדין, בלי לטפל בשורש הסכסוך. לפי הטעם השני של הרמב״ם והסבר הסיכום, מה הייתה מסכת אבות מוסיפה לו?",o:["ידיעה שסמכותו עוברת בשושלת עד סיני, כדי שהציבור יכבד אותו","פירוט מדויק של דיני הנזיקין, שבהם עוסקים פרקי המסכת","הכנה לקבלת התורה, בלימוד בשבתות שבין פסח לשבועות","מידות טובות, כדי לטפל בשורשי הדברים"],c:3,e:"סיכום, חלק ב: לפי הטעם השני המסכת באה «ללמד את הדיינים מידות טובות לבל יזיקו את הציבור»; בתחום הנזיקין יש מקום לפתור בעיות «לא בצורה טכנית, אלא להתמודד עם שורשי הדברים ולאמץ אורח חיים מוסרי». השושלת עד סיני היא הטעם הראשון, והיא אינה פותרת את שורש הסכסוך."},
{l:2,t:"הקריאה בין פסח לשבועות",s:"מוכנות",q:"בשנה מסוימת חל יום טוב הראשון של פסח ביום רביעי. לפי שיטת חכמי ישראל ביחידה, מתי מתחילים לספור את העומר, ומדוע?",o:["ביום ראשון שאחריו, כי «שבת» היא יום השבוע","ביום רביעי עצמו, כי בו מתחיל חג הפסח","ביום חמישי, למחרת יום טוב הראשון, שגם הוא נקרא «שבת»","ביום רביעי שלאחר מכן, כעבור שבוע שלם מן החג"],c:2,e:"סיכום, חלק ג (טבלה, וכן שקף 12): לפי חכמי ישראל «ממחרת השבת» הוא «למחרת יום טוב הראשון של פסח – שכן יום טוב של פסח נקרא ׳שבת׳», ולכן הספירה מתחילה ביום חמישי. הספירה מיום ראשון שאחרי שבת של יום השבוע היא שיטת הצדוקים והקראים."},
{l:2,t:"הקריאה בין פסח לשבועות",s:"מוכנות",q:"מורה מתלבט אם להתחיל ללמד תורה תלמיד חדש שאינו נוהג בנימוסים ובהליכות המקובלים בחברה. מה עולה מן ההסבר ל«דרך ארץ קדמה לתורה» ביחידה?",o:["שיש להקדים וללמדו דרך ארץ, כי בלעדיה לא ניתן ללמדו תורה","שיש ללמדו קודם הלכות ספירת העומר, ואחר כך מוסר ומידות","שיש להתחיל בתורה שבכתב, ולדחות את דרך ארץ לאחר שבועות","שהנימוסים אינם נוגעים ללימוד, כי מסכת אבות אינה עוסקת בהלכה"],c:0,e:"סיכום, חלק ג (וכן שקף 11): «אם אין האדם נוהג ב׳דרך ארץ׳ – בנימוסים ובהליכות המקובלות בחברה שבה הוא חי – לא ניתן ללמד אותו תורה ומצוות», ולכן דרך ארץ קודמת. המסיח האחרון שגוי: העובדה שהמסכת אינה הלכתית אינה מבטלת את הנימוסים – הם בדיוק עניינה."},
{l:2,t:"מסירה ונתינה",s:"מוכנות",q:"סבתא מעבירה לנכדתה סידור משפחתי עתיק ואומרת: «שמרי עליו, ויום אחד תעבירי אותו לילדייך». לפי הרב לאו, לאיזה מושג מתאים המעשה, ומה נובע ממנו?",o:["לנתינה – הסידור הוא מתנה, והנכדה רשאית לעשות בו כרצונה","למסירה – הסידור הוא פיקדון, והנכדה אחראית להנחילו הלאה","למוסר – הסידור מלמד שהמסירה כרוכה בייסורים ובלבטים","לנתינה – הסידור הוא פיקדון, ולכן הנכדה דואגת לו פחות ממתנה"],c:1,e:"סיכום, חלק ה (וכן שקפים 15 ו־17): «הנתינה היא מתנה, המסירה היא פיקדון»; דבר שנמסר כדי שיועבר הלאה הוא פיקדון, ועל פיקדון דואגים יותר משהיו דואגים למתנה – ומכאן האחריות להנחלה לדור הבא. מתנה ניתנת למקבל, ואין בה חובה להעביר הלאה."},
{l:2,t:"מסירה ונתינה",s:"מוכנות",q:"בדיון בכיתה טוען סטודנט: «דור מהפכני חייב לנתק את עצמו מן העבר ולהתחיל מבראשית». איזו תגובה מבטאת את עמדת ברל כצנלסון בציטוט שבמצגת?",o:["דור מחדש זורק את ירושת הדורות כדי לפנות מקום ליצירה חדשה","דור מחדש בוחן ובודק, ולעיתים מחייה מסורת קדומה שתזין אותו","דור מחדש שומר על המסורת כמות שהיא, בלי להוסיף עליה ובלי לגרוע","דור מחדש מקבל את המסורת כמתנה, ולכן אינו נדרש להעבירה הלאה"],c:1,e:"שקף 18: לפי כצנלסון, «דור מחדש ויוצר איננו זורק אל גל האשפה את ירושת הדורות. הוא בוחן ובודק, מרחיק ומקרב», לעיתים מוסיף על המסורת הקיימת ולעיתים «מחזיר לתחייה מסורת קדומה». לכן אין הוא זורק את הירושה, וגם אינו שומר עליה בלי להוסיף."},

}

      arr.length+" שאלות · "+sub+"</div></div>";
  if(mode==="end") h+='<div class="pcols">';
  arr.forEach(function(q,i){
    h+='<div class="pq">'+(mock?'':'<div class="pt">יחידה '+q.l+' · '+esc(q.t)+'</div>')+
       '<div><span class="pn">'+(i+1)+'.</span> '+esc(q.q)+'</div>';
    q.o.forEach(function(o,k){ h+='<div class="po">'+LET[k]+". "+esc(o)+"</div>"; });
    if(mode==="in")
      h+='<div class="po pa">✔ '+LET[q.c]+". "+esc(q.o[q.c])+'</div>'+

/* דגימה שווה בין השיעורים: המבחן האמיתי שואל שאלה-שתיים מכל שיעור. לוקחים לסירוגין מכל שיעור בתורו,
   וסדר השיעורים אקראי: כשיש יותר מעשרה שיעורים, השאלה השנייה לא נופלת תמיד על אותם שיעורים. */
function balancedPick(arr,n){
  var by={},order=[];
  arr.forEach(function(q){ if(!by[q.l]){by[q.l]=[];order.push(q.l);} by[q.l].push(q); });
  shuffle(order);
  var out=[],i=0;
  while(out.length<n){
    var added=false;
    for(var k=0;k<order.length&&out.length<n;k++){
      var pool=by[order[k]];
      if(i<pool.length){ out.push(pool[i]); added=true; }
    }
    if(!added)break;
    i++;
  }
  return out;
}

  },null);
}

/* מקלדת, במסך של שאלה: חץ שמאלה = הבאה, חץ ימינה = הקודמת (האתר מימין לשמאל), 1-5 = בחירת תשובה */
document.addEventListener("keydown",function(ev){
  if(!app.querySelector(".qtext")||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  var bs=app.querySelectorAll(".nav .btn");
  if(ev.key==="ArrowLeft"&&bs[1]&&!bs[1].disabled){ev.preventDefault();bs[1].click();}
  else if(ev.key==="ArrowRight"&&bs[0]&&!bs[0].disabled){ev.preventDefault();bs[0].click();}
  else if(/^[1-5]$/.test(ev.key)){
    var o=app.querySelectorAll(".opt")[+ev.key-1];
    if(o&&o.className.indexOf("locked")<0){ev.preventDefault();o.click();}
  }
});

/* ---------- exam mode ---------- */
function examStart(){
  ctx="";
  quiz=buildQuiz();
  if(sel.count&&quiz.length>sel.count)
    quiz=sel.balanced?shuffle(balancedPick(quiz,sel.count)):quiz.slice(0,sel.count);
  idx=0;ansMap=new Array(quiz.length);
  timeLeft=sel.minutes*60;
  if(sel.minutes)startTimer();
  eRender();
}
function startTimer(){
  stopTimer();
  timer=setInterval(function(){
    timeLeft--;
    var el=document.getElementById("clock");
    if(el)el.textContent=fmt(timeLeft);
    if(timeLeft<=0){stopTimer();examSubmit(true);}
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function eRender(){
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar(ctx==="ready"?'מבחן מוכנות · זמן: <span class="clock" id="clock">'+fmt(elapsed)+'</span>':
    ctx==="mock"?mockForm.name+' · זמן שנותר: <span class="clock" id="clock">'+fmt(timeLeft)+'</span>':
    sel.minutes?'זמן שנותר: <span class="clock" id="clock">'+fmt(timeLeft)+'</span>':""));
  var nAns=0;for(var i=0;i<ansMap.length;i++)if(ansMap[i]!=null)nAns++;
  var st=E("div",{"class":"stats"});
  st.innerHTML="<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span><span>נענו: <b>"+nAns+"</b></span>";
  c.appendChild(st);
  c.appendChild(bar(nAns/quiz.length));
  if(ctx!=="ready"&&ctx!=="mock")c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"+(ansMap[idx]===i?" picked":"")});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){ansMap[idx]=i;eRender();};
    box.appendChild(b);
  });
  c.appendChild(box);

  var nav=E("div",{"class":"nav"});
  var prev=E("button",{"class":"btn"},"→ הקודמת");
  prev.disabled=idx===0;prev.onclick=function(){idx--;eRender();};
  var next=E("button",{"class":"btn btn-pri"},"הבאה ←");
  next.disabled=idx===quiz.length-1;next.onclick=function(){idx++;eRender();};
  nav.appendChild(prev);nav.appendChild(next);
  c.appendChild(nav);

  c.appendChild(E("div",{"class":"ptitle",style:"margin-top:16px"},"מפת שאלות — לחצו כדי לעבור לשאלה · מסומנות: שאלות שנענו"));
  var pal=E("div",{"class":"palette"});
  quiz.forEach(function(_,i){
    var b=E("button",{"class":"pbtn"+(ansMap[i]!=null?" ans":"")+(i===idx?" cur":"")},String(i+1));
    b.onclick=function(){idx=i;eRender();};
    pal.appendChild(b);
  });
  c.appendChild(pal);

  var sub=E("button",{"class":"btn btn-pri"},"הגשת המבחן");
  sub.style.width="100%";sub.style.marginTop="14px";
  sub.onclick=function(){
    var un=quiz.length-nAns;
    if(un>0&&!confirm("נותרו "+un+" שאלות ללא מענה. להגיש בכל זאת?"))return;
    examSubmit(false);
  };
  c.appendChild(sub);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function examSubmit(auto){
  stopTimer();
  var sc=0,wr=[];
  quiz.forEach(function(q,i){ if(ansMap[i]===q.c)sc++; else wr.push({q:q,given:ansMap[i]}); });
  if(ctx==="ready")readySave(sc,quiz.length);
  if(ctx==="mock"){
    elapsed=MOCK_MIN*60-timeLeft;
    mockSave(mockForm,sc,quiz.length);
    /* במבחן המדמה הסקירה עוברת על כל השאלות, גם על אלה שנענו נכון: ניחוש נכון עדיין מצריך הסבר */
    var all=quiz.map(function(q,i){return {q:q,given:ansMap[i],ok:ansMap[i]===q.c};});
    var f=mockForm;
    results(sc,quiz.length,wr.map(function(x){return x.q;}),function(){mockStart(f);},null,all,auto);
    return;
  }
  results(sc,quiz.length,wr.map(function(x){return x.q;}),ctx==="ready"?readyStart:examStart,null,wr,auto);
}

/* ---------- results ---------- */
function results(sc,total,wr,onAgain,onRetryWrong,detail,auto){
  stopTimer();
  app.innerHTML="";
  var pct=total?Math.round(sc/total*100):0;
  var c=E("div",{"class":"card result"});
  if(auto)c.appendChild(E("div",{"class":"note"},"<b>הזמן נגמר</b> — המבחן הוגש אוטומטית."));
  if(ctx==="ready")c.appendChild(E("div",{"class":"note"},"<b>מבחן מוכנות</b> · "+minsTxt(elapsed)+
    " · השאלות האלה לא מופיעות בתרגול, ולכן הציון מעריך שליטה בחומר."));
  if(ctx==="mock")c.appendChild(E("div",{"class":"note"},"<b>"+mockForm.name+"</b> · "+minsTxt(elapsed)+
    " מתוך "+MOCK_MIN+" · 5 נקודות לשאלה. "+
    "למטה: פילוח לפי יחידה, וכל השאלות עם התשובה הנכונה וההסבר."));
  c.appendChild(E("div",{"class":"big"},pct));
  var g = pct>=90?"מצוין — שליטה מלאה בחומר":
          pct>=80?"טוב מאוד — סביב הממוצע שהמרצה מצפה לו":
          pct>=70?"טוב — כדאי לחזור על הנושאים החלשים":
          pct>=60?"עובר — מומלץ לחזור ולתרגל":
                  "מתחת לציון עובר — כדאי לחזור על החומר ולתרגל שוב";
  c.appendChild(E("div",{"class":"grade"},sc+" מתוך "+total+(total===20?" · במונחי המבחן: "+(sc*5)+" נקודות":"")+" · "+g));

  var nav=E("div",{"class":"nav"});
  var again=E("button",{"class":"btn btn-pri"},ctx==="mock"||ctx==="ready"?"ניסיון נוסף":"סבב חדש");
  again.onclick=onAgain;nav.appendChild(again);
  if(onRetryWrong&&wr.length){
    var rw=E("button",{"class":"btn"},"תרגול "+wr.length+" השגויות");
    rw.onclick=onRetryWrong;nav.appendChild(rw);
  }
  var home=E("button",{"class":"btn"},"הגדרות");
  home.onclick=setup;nav.appendChild(home);
  c.appendChild(nav);
  app.appendChild(c);

  if(detail)app.appendChild(breakdown(quiz,wr));
  if(detail&&detail.length){
    var d=E("div",{"class":"card"});
    var full=ctx==="mock";
    d.appendChild(E("div",{"class":"ptitle"},full?"סקירת כל "+detail.length+" השאלות · "+wr.length+" שגויות":"סקירת "+detail.length+" השאלות שנענו לא נכון"));
    detail.forEach(function(x,k){
      var r=E("div",{"class":"rev"});
      var given = x.given==null?"<i>לא נענתה</i>":LET[x.given]+". "+x.q.o[x.given];
      /* במבחן המדמה: כל המשפטים של השאלה, כדי לבדוק כל משפט מול ההסבר */
      var opts = full?'<div style="margin:4px 0 2px">'+x.q.o.map(function(o,i){return LET[i]+". "+o;}).join("<br>")+'</div>':"";
      r.innerHTML='<div style="font-size:11.5px;color:var(--muted)">'+(full?"שאלה "+(k+1)+" · ":"")+'יחידה '+x.q.l+' · '+x.q.t+'</div>'+
        '<div class="rq">'+x.q.q+'</div>'+opts+
        (x.ok?'<div class="rc">✓ נכון: '+given+'</div>':
          '<div class="ra">התשובה שלך: '+given+'</div>'+
          '<div class="rc">התשובה הנכונה: '+LET[x.q.c]+". "+x.q.o[x.q.c]+'</div>')+
        '<div style="margin-top:6px;color:var(--muted)">'+rich(x.q.e)+'</div>';
      d.appendChild(r);
    });
    app.appendChild(d);
  } else if(wr.length){
    var d2=E("div",{"class":"card"});
    d2.appendChild(E("div",{"class":"ptitle"},"נושאים לחזרה"));
    var byTopic={},order=[];
    wr.forEach(function(q){var k="יחידה "+q.l+" · "+q.t;if(!byTopic[k]){byTopic[k]=0;order.push(k);}byTopic[k]++;});
    var ul=E("div",{"class":"toolbar"});
    order.forEach(function(t){
      ul.appendChild(E("span",{"class":"pill"},t+" — "+byTopic[t]+(byTopic[t]===1?" שגיאה":" שגיאות")));
    });
    d2.appendChild(ul);
    app.appendChild(d2);
  }
  window.scrollTo(0,0);
}

/* פילוח לפי שיעור בסוף מבחן: כמה נענו נכון מכל שיעור, ועל מה לחזור קודם */
function breakdown(all,wrongQs){
  var by={},order=[],bad={};
  all.forEach(function(q){if(!by[q.l]){by[q.l]=0;order.push(q.l);}by[q.l]++;});
  wrongQs.forEach(function(q){bad[q.l]=(bad[q.l]||0)+1;});
  order.sort(function(a,b){return a-b;});
  var d=E("div",{"class":"card"});
  d.appendChild(E("div",{"class":"ptitle"},"פילוח לפי יחידה"));
  var weak=[];
  order.forEach(function(l){
    var n=by[l],ok=n-(bad[l]||0),f=ok/n;
    if(f<0.75)weak.push({l:l,f:f});
    var row=E("div",{"class":"brk"+(f<0.5?" low":f<1?" mid":"")});
    row.innerHTML='<span class="bl">יחידה '+l+' · '+(LNAME[l]||"")+'</span>'+
      '<span class="bb"><i style="width:'+Math.round(f*100)+'%"></i></span><span class="bv">'+ok+'/'+n+'</span>';
    d.appendChild(row);
  });
  if(weak.length){
    weak.sort(function(a,b){return a.f-b.f||a.l-b.l;});
    var ls=weak.map(function(w){return w.l;});
    d.appendChild(E("div",{"class":"scopehint",style:"margin:12px 0 10px"},
      "כדאי לחזור קודם על: "+ls.map(function(l){return "יחידה "+l+" ("+(LNAME[l]||"")+")";}).join(", ")+"."));
    var go=E("button",{"class":"btn"},"תרגול היחידות האלה");
    go.onclick=function(){sel.lects=ls.slice();sel.topics=TOPICS.slice();sel.src="all";sel.mode="practice";ctx="";setup();};
    d.appendChild(go);
  } else d.appendChild(E("div",{"class":"scopehint",style:"margin-top:12px"},"בלי שגיאות. כל היחידות עברו."));
  return d;
}

setup();
})();
